<style>
/* Layout: eine Spalte wie ein Werktisch; oben die Perlenmatte mit dem Armband, darunter die Werkzeuge; Reiter unten am Daumen. */
:root {
  --papier: #f5f3f7; --flaeche: #ffffff; --tinte: #1e2130; --gedaempft: #62667a; --linie: #e3e0ea;

  --schrift: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --reiter-hoehe: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papier: #14161d; --flaeche: #1d2029; --tinte: #ebe9f1; --gedaempft: #a2a5b6; --linie: #2d3140;
  --akzent: #f0779f; --akzent-text: #22121a; --akzent-zart: #3a2030; --gut: #6fcf97; color-scheme: dark } }
:root[data-theme="dark"] {
  --papier: #14161d; --flaeche: #1d2029; --tinte: #ebe9f1; --gedaempft: #a2a5b6; --linie: #2d3140;
  --akzent: #f0779f; --akzent-text: #22121a; --akzent-zart: #3a2030; --gut: #6fcf97; color-scheme: dark }
html, body { height: 100%; }
/* S-003: Tastaturfokus nie unter der haftenden Vorschau oder der Reiterleiste */
html:has(#bereich-designer:not([hidden])) { scroll-padding-top: 162px; scroll-padding-bottom: calc(var(--reiter-hoehe) + 20px + env(safe-area-inset-bottom, 0px)); }
body { background: var(--papier); color: var(--tinte); font: 400 16px/1.5 var(--schrift); -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.seite { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--reiter-hoehe) + 28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }

.buehne { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; border-radius: 18px; overflow: hidden; background: #272e3f; box-shadow: 0 10px 30px rgba(20, 24, 40, 0.18); }   /* Farbe des Leinwandrands: keine Naht neben der kleinen Leinwand */

.raster-huelle { overflow-x: auto; }

.ideen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.karte { display: grid; gap: 6px; text-align: left; padding: 0 0 12px; border-radius: 16px; border: 1px solid var(--linie); background: var(--flaeche); cursor: pointer; overflow: hidden; min-height: 44px; }
.karte canvas { width: 100%; aspect-ratio: 5 / 4; display: block; background: var(--matte); }

.liste { list-style: none; margin: 0; padding: 0; display: grid; }

.punkt { width: 18px; height: 18px; border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 6px; box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.3); }

ol.schritte { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }

ol.schritte li > span { min-width: 0; }

ul.tipps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.entwuerfe { display: grid; gap: 8px; }
.entwurf { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
nav.reiter { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--flaeche); border-top: 1px solid var(--linie);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.reiter div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.reiter button { min-height: 52px; border: 0; background: transparent; border-radius: 12px; font-weight: 800; font-size: 0.82rem; color: var(--gedaempft); cursor: pointer; display: grid; place-items: center; gap: 2px; }
nav.reiter button svg { width: 22px; height: 22px; }
nav.reiter button[aria-current="page"] { color: var(--akzent); background: var(--akzent-zart); }
.meldung { position: fixed; left: 50%; bottom: calc(var(--reiter-hoehe) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6;
  background: var(--tinte); color: var(--papier); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); }
/* S-010 Druck: nur der offene Bereich, schwarz auf weiß, ohne Reiter, Kopf, Tasten und Meldung */
@media print {
  :root:not([data-theme="light"]), :root[data-theme] { --papier: #fff; --flaeche: #fff; --tinte: #000; --gedaempft: #333; --linie: #bbb; --akzent: #000; --akzent-zart: #eee; --gut: #1f5f3a; color-scheme: light; }

  .seite { padding: 0; max-width: none; }

}
/* S-008 Dateiwahl unsichtbar, die Taste "Bild wählen" öffnet sie */
.versteckt { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

.preis { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.loch { padding-left: 10px; border-left: 3px solid var(--gut); }

.knopf.gross { min-height: 56px; font-size: 1.05rem; }
#basteln { width: 100%; }
html.arbeitet, html.arbeitet body { overflow: hidden; }
.arbeit { position: fixed; inset: 0; z-index: 8; background: var(--papier); overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.arbeit-innen { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; min-height: 100%; grid-template-rows: auto auto auto 1fr auto auto auto; }
.arbeit-stand { margin: 0; font: 800 1.25rem/1.2 var(--schrift-titel); }
.arbeit-fortschritt { height: 8px; border-radius: 4px; background: var(--linie); overflow: hidden; }
.arbeit-fortschritt span { display: block; height: 100%; background: var(--akzent); }
.arbeit-buehne { background: var(--matte); color: #f1eef6; border-radius: 18px; padding: 20px 16px; display: grid; justify-items: center; align-content: center; gap: 14px; text-align: center; min-width: 0; }
.arbeit-buehne h2 { color: #f1eef6; }
.arbeit-buehne .hinweis, .arbeit-buehne .unter { color: #c5c9d8; }
.arbeit-text { margin: 0; font-size: 1.15rem; font-weight: 700; }
.arbeit-perle { display: block; box-shadow: inset -6px -8px 14px rgba(0,0,0,0.28), 0 6px 18px rgba(0,0,0,0.35); }

.klein-feld { width: 6.5em; min-height: 44px; text-align: right; padding: 8px 10px; font-size: 1rem; }
.eingaben { display: grid; gap: 8px; } .eingabe { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .eingabe label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; } .eingabe .klein { display: block; width: 100%; }
.arbeit-band { display: block; max-width: 100%; height: auto; border-radius: 4px; }

<script>
(function(){
var Perlen = globalThis.Perlen = globalThis.Perlen || {};
Perlen.entity = (function () {
const FARBEN = [
{ name: 'Rot', hex: '#d62839' }, { name: 'Koralle', hex: '#f26b5b' }, { name: 'Orange', hex: '#f39237' },
{ name: 'Gelb', hex: '#f6c945' }, { name: 'Grün', hex: '#3fa34d' }, { name: 'Mint', hex: '#8fd9b6' },
{ name: 'Türkis', hex: '#1fb5b0' }, { name: 'Himmelblau', hex: '#5aa9e6' }, { name: 'Nazarblau', hex: '#1d4fa8' },
{ name: 'Nachtblau', hex: '#1b2a4a' }, { name: 'Lila', hex: '#8a4fbf' }, { name: 'Rosa', hex: '#f4a6c1' },
{ name: 'Weiß', hex: '#f7f5ef' }, { name: 'Perlmutt', hex: '#e9dccb' }, { name: 'Gold', hex: '#d4a72c', metall: true },
{ name: 'Silber', hex: '#b9c0c8', metall: true }, { name: 'Schwarz', hex: '#1c1c1f' }, { name: 'Braun', hex: '#8b5a3c' }
];
const FORMEN = { rund: 'Rund', rondelle: 'Rondelle', herz: 'Herz', tropfen: 'Tropfen', wuerfel: 'Buchstabe' };
const ANHAENGER = { nazar: 'Nazar', herz: 'Herz', stern: 'Stern', mond: 'Mond', klee: 'Kleeblatt' };
const GROESSEN = [4, 6, 8, 10];
const TECHNIKEN = {
gummi: { name: 'Gummiband', zugabe: 10, verschluss: 0, raster: false },
faden: { name: 'Schmuckfaden mit Verschluss', zugabe: 15, verschluss: 15, raster: false },
peyote: { name: 'Peyote mit Nadel', zugabe: 15, verschluss: 20, raster: true },
loom: { name: 'Webrahmen', zugabe: 15, verschluss: 20, raster: true }
};
const DELICA = { breite: 1.3, laenge: 1.6, proGramm: 190, proTuetchen: 950 };
const PREISE = { strang4: 2.5, strang6: 2.9, strang8: 3.5, strang10: 3.9, delica: 3.9, abc: 3.5, gummi: 2.5, schmuck: 3.0, perlenfaden: 2.5,
karabiner: 2.0, biegering: 1.5, anhaenger: 2.0, quetsch: 1.5, kaschier: 1.5, klemmen: 2.5 };
const PREIS_NAMEN = { strang4: 'Strang 4 mm', strang6: 'Strang 6 mm', strang8: 'Strang 8 mm', strang10: 'Strang 10 mm', delica: 'Delica-Tütchen 5 g',
abc: 'ABC-Mischbeutel', gummi: 'Rolle Gummiband', schmuck: 'Rolle Schmuckfaden', perlenfaden: 'Spule Perlenfaden', karabiner: 'Beutel Karabiner',
biegering: 'Beutel Biegeringe', quetsch: 'Beutel Quetschperlen', kaschier: 'Beutel Kaschierperlen', klemmen: 'Beutel Klemmenden', anhaenger: 'Anhänger' };
const LOCH_MM = { 4: 0.8, 6: 1.0, 8: 1.0, 10: 1.2, wuerfel: 3.5, delica: 0.8 };
const FADEN_MM = { gummi: 0.8, gummiDuenn: 0.5, schmuck: 0.38, perlenfaden: 0.3 };
const LOCH_SPIEL_MM = 0.2, FADEN_STUECK_CM = 150, ABC_BEUTEL = 100;
const STRANG = { 4: 100, 6: 66, 8: 50, 10: 40 };
const KLEMMEN = [10, 13, 16, 20, 25, 30];
const WUERFEL_MM = 6;
const PASSFORMEN = { eng: -5, normal: 0, locker: 10 };
const GROESSENHILFE = [{ name: 'Kind', umfang: 140 }, { name: 'Jugend', umfang: 155 }, { name: 'Erwachsene', umfang: 165 }, { name: 'Groß', umfang: 185 }];
const DICKE_OHNE_ZUGABE = 4;
const BUCHSTABEN = /[A-ZÄÖÜ]/;

function zahl(v) {
if (v === null || v === undefined || v === '' || typeof v === 'boolean') return NaN;
return Number(v);
}
function klemme(v, min, max, standard) {
const n = zahl(v);
if (!isFinite(n)) return standard;
return Math.min(max, Math.max(min, Math.round(n)));
}
function perlenLaenge(p) {
if (p.buchstabe || p.form === 'wuerfel') return WUERFEL_MM;
if (p.form === 'tropfen') return Math.round(p.groesse * 1.3 * 10) / 10;
return p.form === 'rondelle' ? Math.round(p.groesse * 0.6 * 10) / 10 : p.groesse;
}
function passform(v) { return typeof v === 'string' && Object.prototype.hasOwnProperty.call(PASSFORMEN, v) ? v : 'normal'; }
function istRaster(technik) { return !!(TECHNIKEN[technik] && TECHNIKEN[technik].raster); }
function pruefsumme(text) {
let h = 0x811c9dc5;
for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }

(function(){
var Perlen = globalThis.Perlen = globalThis.Perlen || {};

const E = Perlen.entity, R = Perlen.control.rechner;
const NEIGUNG = 0.42;   // Verhältnis der Ellipsenachsen: Ring liegt schräg vor dem Betrachter

const rx = Math.min(breite * 0.38, (hoehe - bandHoehe) * 0.9);
return { cx: breite / 2, cy: hoehe * 0.43, rx, ry: rx * NEIGUNG };
}
const massstab = tiefe => 0.86 + 0.14 * (tiefe + 1) / 2;

function aufgefaedelt(e, breite, hoehe) {
const f = R.folge(e);
const laengen = f.map(E.perlenLaenge), gesamt = laengen.reduce((a, b) => a + b, 0) || 1;
const r0 = rahmen(breite, hoehe, 0);
const n = e.runden || 1, s = (2 * Math.PI * r0.rx * n) / gesamt;   // Pixel je Millimeter entlang des Rings
const stufe = n > 1 ? f.reduce((m, p) => Math.max(m, p.groesse), 0) * s * 0.95 : 0;   // Abstand der Runden
let lauf = 0;
return { ring: r0, mmPx: s, perlen: f.map((p, i) => {
const anteil = (lauf + laengen[i] / 2) / gesamt, w = 1.5 * Math.PI - 2 * Math.PI * n * (lauf + laengen[i] / 2) / gesamt + Math.PI * (n - 1);
lauf += laengen[i];
const tiefe = Math.sin(w), k = massstab(tiefe);
return { x: r0.cx + r0.rx * Math.cos(w), y: r0.cy + r0.ry * Math.sin(w) + (n * anteil - n / 2) * stufe, r: (p.groesse / 2) * s * k, laenge: laengen[i] * s * k,
winkel: w, tiefe, farbe: p.farbe, form: p.form, buchstabe: p.buchstabe || '', reihe: i, spalte: 0, versatz: 0 };
}) };
}

const r = R.raster(e), P = R.strecke(e);
const r0 = rahmen(breite, hoehe, 0);
const s = (2 * Math.PI * r0.rx) / P;
const bandHoehe = r.breite * s;
const versetzt = e.technik === 'peyote';
const perlen = [];
for (let z = 0; z < r.reihen; z++) for (let sp = 0; sp < r.spalten; sp++) {
const versatz = versetzt && sp % 2 === 1 ? 0.5 : 0;
const w = 1.5 * Math.PI - 2 * Math.PI * (z + 0.5 + versatz) / r.reihen;   // vorn wie im Editor: Reihen nach rechts
const tiefe = Math.sin(w), k = massstab(tiefe);

r: (E.DELICA.breite / 2) * s * k, laenge: E.DELICA.laenge * s * k, winkel: w, tiefe, farbe: r.zelle(z, sp), form: 'delica', buchstabe: '',
reihe: z, spalte: sp, versatz });
}
return { ring: r0, mmPx: s, bandHoehe, perlen };
}

function geometrie(entwurf, breite, hoehe) {
const g = E.istRaster(entwurf.technik) ? raster(entwurf, breite, hoehe) : aufgefaedelt(entwurf, breite, hoehe);
const n = g.perlen.length, idx = new Array(n);
for (let i = 0; i < n; i++) idx[i] = i;
const alt = g.perlen;
idx.sort((a, b) => (alt[a].tiefe - alt[b].tiefe) || (a - b));
g.perlen = idx.map(i => alt[i]);
if (entwurf.anhaenger && alt.length) {
const r = g.ring, maxR = alt.reduce((m, p) => Math.max(m, p.r), 0), d = Math.max(maxR * 2.2, 8 * g.mmPx);
const vorn = alt.filter(p => p.tiefe > 0.5 && Math.abs(p.x - r.cx) < r.rx * 0.3), unten = vorn.length ? Math.max(...vorn.map(p => p.y + p.r)) : r.cy + r.ry + (g.bandHoehe || 0) / 2;
g.anhaenger = { art: entwurf.anhaenger, x: r.cx, oben: unten - maxR * 0.4, y: Math.min(hoehe - d * 0.55, unten + d * 0.7), r: d / 2 };
}
return g;
}

function pruefsumme(g) {
const zahlen = [];
for (const p of g.perlen) zahlen.push(Math.round(p.x * 1000), Math.round(p.y * 1000), Math.round(p.r * 1000), p.farbe, p.buchstabe ? p.buchstabe.charCodeAt(0) : 0);

}

app.teileBild = (c, titel) => sitzung.teileBild(c, titel);
app.jetzt = () => fenster.performance.now();

app.starte = function (f) {
fenster = f; app.dokument = f.document; B.setzeDokument(f.document); Perlen.ui.anleitungsbild.setze(f);
sitzung = Perlen.control.sitzung.starte(f);
const z = app.zustand;
lade();
const start = Perlen.control.ideen.liste()[0].entwurf;
tab = Perlen.control.sicherung.starte(f);
const zurueck = tab.tabLesen();
z.verlauf = W.verlauf(start, zurueck && zurueck.verlauf);
for (const r of REITER) bereiche[r.id] = el('section', { id: 'bereich-' + r.id, 'aria-label': r.name, class: 'stapel', hidden: true });
const nav = el('nav', { class: 'reiter', 'aria-label': 'Bereiche' }, el('div', {}, REITER.map(r => (reiterKnoepfe[r.id] =
el('button', { type: 'button', 'data-reiter': r.id, onclick: () => zeige(r.id) }, B.icon(r.id), r.name)))));
f.document.getElementById('app').replaceChildren(
el('div', { class: 'seite' }, el('header', { class: 'kopf' }, el('h1', {}, 'Perlen', el('span', {}, 'werkstatt')), document.querySelector('a.ng-zurueck')),
REITER.map(r => bereiche[r.id])), nav);
designer = Perlen.ui.designer.erzeuge(app);
designer.haenge(bereiche.designer);
arbeit = Perlen.ui.arbeit.erzeuge(app, f);
if (z.daten.neuer) B.melde(NEUER, 6000); else if (!z.speicherOk) B.melde('Speichern ist hier nicht möglich, alles andere geht');
const ablegen = () => tab.tabAblegen(z.verlauf.ablegen(), z.reiter);
f.document.addEventListener('visibilitychange', () => { if (f.document.visibilityState === 'hidden') ablegen(); });
f.addEventListener('pagehide', ablegen);
app.ablegen = ablegen;
zeige(zurueck ? zurueck.reiter : 'ideen');
};
return app;
})();

})();

Perlen.ui.app.starte(window);
</script>
