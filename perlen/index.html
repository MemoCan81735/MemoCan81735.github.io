<!doctype html>
<html lang="de">

<title>Perlenwerkstatt</title>
<style>
/* Layout: eine Spalte wie ein Werktisch; oben die Perlenmatte mit dem Armband, darunter die Werkzeuge; Reiter unten am Daumen. */
:root {
  --papier: #f5f3f7; --flaeche: #ffffff; --tinte: #1e2130; --gedaempft: #62667a; --linie: #e3e0ea;
  --akzent: #b02e64; --akzent-text: #ffffff; --akzent-zart: #f8e3ec; --matte: #2b3446; --gut: #2f7d4f;
  --schrift-titel: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --schrift: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --reiter-hoehe: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papier: #14161d; --flaeche: #1d2029; --tinte: #ebe9f1; --gedaempft: #a2a5b6; --linie: #2d3140;
  --akzent: #f0779f; --akzent-text: #22121a; --akzent-zart: #3a2030; --gut: #6fcf97; color-scheme: dark } }
:root[data-theme="dark"] {
  --papier: #14161d; --flaeche: #1d2029; --tinte: #ebe9f1; --gedaempft: #a2a5b6; --linie: #2d3140;
  --akzent: #f0779f; --akzent-text: #22121a; --akzent-zart: #3a2030; --gut: #6fcf97; color-scheme: dark }
html, body { height: 100%; }
/* S-003: Tastaturfokus nie unter der haftenden Vorschau oder der Reiterleiste */
html:has(#bereich-designer:not([hidden])) { scroll-padding-top: 162px; scroll-padding-bottom: calc(var(--reiter-hoehe) + 20px + env(safe-area-inset-bottom, 0px)); }
body { background: var(--papier); color: var(--tinte); font: 400 16px/1.5 var(--schrift); -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.seite { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--reiter-hoehe) + 28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
header.kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 800 1.6rem/1.1 var(--schrift-titel); letter-spacing: -0.01em; margin: 0; }
h1 span { color: var(--akzent); }
h2 { font: 700 1.2rem/1.2 var(--schrift-titel); margin: 0; text-wrap: balance; }
h3 { font: 700 0.78rem/1.2 var(--schrift); text-transform: uppercase; letter-spacing: 0.08em; color: var(--gedaempft); margin: 0; }
.unter { color: var(--gedaempft); font-size: 0.9rem; }
section[hidden] { display: none; }
.stapel { display: grid; gap: 12px; }
.zeile { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.knopf { min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--linie); background: var(--flaeche); font-weight: 700; cursor: pointer; }
.knopf:disabled { opacity: 0.45; cursor: default; }
.knopf.haupt { background: var(--akzent); color: var(--akzent-text); border-color: transparent; }
.knopf:focus-visible, .wahl button:focus-visible, .feld:focus-visible, .karte:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
.wahl { display: flex; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 3px; gap: 3px; overflow-x: auto; }
.wahl button { flex: 1 0 auto; min-height: 44px; border: 0; border-radius: 9px; background: transparent; padding: 0 12px; font-weight: 700; color: var(--gedaempft); cursor: pointer; }
.wahl.gitter { display: grid; grid-template-columns: 1fr 1fr; }
.wahl button[aria-pressed="true"] { background: var(--akzent-zart); color: var(--tinte); }
/* Bühne (S-003): haftet oben; designer.js setzt beim Scrollen Höhe und unteren Rand (Seite bleibt gleich hoch) */
.buehne { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; border-radius: 18px; overflow: hidden; background: #272e3f; box-shadow: 0 10px 30px rgba(20, 24, 40, 0.18); }   /* Farbe des Leinwandrands: keine Naht neben der kleinen Leinwand */
.buehne canvas { display: block; width: 100%; aspect-ratio: 5 / 4; max-width: min(100%, calc((100vh - 150px) * 1.25)); margin: 0 auto; }
.buehne.klein canvas { width: auto; height: 100%; max-width: 100%; }
.ecke { position: absolute; top: 8px; z-index: 1; min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 999px; display: grid; place-items: center;
  background: rgba(14, 17, 26, 0.62); color: #f3f1f7; font-weight: 800; cursor: pointer; backdrop-filter: blur(4px); }
.ecke.links { left: 8px; width: 44px; padding: 0; }
.ecke.rechts { right: 8px; display: flex; gap: 6px; }
.buehne.eng .ecke.rechts { padding: 0; width: 44px; justify-content: center; }
.buehne.eng .ecke.rechts span, .buehne.eng .zahlen { display: none; }
.ecke svg { width: 22px; height: 22px; }
.ecke:disabled { opacity: 0.6; cursor: default; }
.ecke:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
.zahlen { position: absolute; left: 12px; bottom: 10px; max-width: calc(100% - 24px); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: rgba(14, 17, 26, 0.62); color: #f3f1f7; border-radius: 999px; padding: 3px 12px; font-size: 0.82rem; font-weight: 700; font-variant-numeric: tabular-nums; backdrop-filter: blur(4px); }
.einstellungen { padding-block: 6px; }
.einstellungen > summary { min-height: 44px; display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; border-radius: 10px; }
.einstellungen > summary::-webkit-details-marker { display: none; }
.einstellungen > summary::after { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); margin-right: 6px; }
.einstellungen[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.einstellungen[open] { padding-bottom: 14px; }
.einstellungen > summary:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
.kurz-titel { font: 700 0.78rem/1.2 var(--schrift); text-transform: uppercase; letter-spacing: 0.08em; color: var(--gedaempft); }
.kurz-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.kurz-wert { font-weight: 800; font-variant-numeric: tabular-nums; }
.werkzeuge { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.block { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 16px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.regler { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.regler input[type=range] { width: 100%; accent-color: var(--akzent); height: 44px; }
.wert { font: 800 1.5rem/1 var(--schrift-titel); font-variant-numeric: tabular-nums; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.farbe { aspect-ratio: 1; min-height: 44px; border-radius: 50%; border: 2px solid var(--linie); cursor: pointer; position: relative; }
.farbe[aria-pressed="true"] { border-color: var(--tinte); box-shadow: 0 0 0 3px var(--akzent); }
.muster { display: flex; gap: 0; flex-wrap: wrap; min-height: 44px; align-items: center; }
.muster button { border: 0; padding: 0; cursor: pointer; background: transparent; min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 10px; }
.muster button:hover { background: var(--akzent-zart); }
.muster span { display: block; box-shadow: inset -2px -3px 4px rgba(0, 0, 0, 0.25), inset 2px 2px 3px rgba(255, 255, 255, 0.45); }
.feld { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--linie); background: var(--papier); padding: 0 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.raster-huelle { overflow-x: auto; }
.raster-huelle canvas { display: block; touch-action: none; margin: 0 auto; border-radius: 8px; }
.ideen { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.karte { display: grid; gap: 6px; text-align: left; padding: 0 0 12px; border-radius: 16px; border: 1px solid var(--linie); background: var(--flaeche); cursor: pointer; overflow: hidden; min-height: 44px; }
.karte canvas { width: 100%; aspect-ratio: 5 / 4; display: block; background: var(--matte); }
.karte b { padding: 0 12px; font: 700 1rem/1.2 var(--schrift-titel); }
.karte small { padding: 0 12px; color: var(--gedaempft); font-size: 0.82rem; line-height: 1.35; }
.marke { margin: 0 12px; justify-self: start; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--akzent); }
.liste { list-style: none; margin: 0; padding: 0; display: grid; }
.liste li { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--linie); }
.liste li:last-child { border-bottom: 0; }
.liste input { width: 24px; height: 24px; accent-color: var(--akzent); justify-self: center; }
.liste label { cursor: pointer; min-width: 0; }
.liste .zahl { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.liste .klein { display: block; color: var(--gedaempft); font-size: 0.8rem; }
.liste li.erledigt label { text-decoration: line-through; color: var(--gedaempft); }
.punkt { width: 18px; height: 18px; border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 6px; box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.3); }
.hinweis { font-size: 0.88rem; color: var(--gedaempft); margin: 0; }
ol.schritte { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
ol.schritte li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
ol.schritte li > span { min-width: 0; }
.schrittbild { grid-column: 1 / -1; display: block; width: 100%; max-width: 440px; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--matte); cursor: pointer; }
.schrittbild:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
ol.schritte li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--akzent-zart); color: var(--tinte); display: grid; place-items: center; font-weight: 800; }
ul.tipps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.entwuerfe { display: grid; gap: 8px; }
.entwurf { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
nav.reiter { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--flaeche); border-top: 1px solid var(--linie);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.reiter div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.reiter button { min-height: 52px; border: 0; background: transparent; border-radius: 12px; font-weight: 800; font-size: 0.82rem; color: var(--gedaempft); cursor: pointer; display: grid; place-items: center; gap: 2px; }
nav.reiter button svg { width: 22px; height: 22px; }
nav.reiter button[aria-current="page"] { color: var(--akzent); background: var(--akzent-zart); }
.meldung { position: fixed; left: 50%; bottom: calc(var(--reiter-hoehe) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6;
  background: var(--tinte); color: var(--papier); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .meldung { transition: opacity 0.2s; } }
a.ng-zurueck{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:var(--flaeche);border:1px solid var(--linie);color:var(--tinte);font-weight:700;text-decoration:none}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
</style>

<body>
<a class="ng-zurueck" href="../">← Spiele</a>
<div id="app"></div>
<div class="meldung" id="meldung" role="status" aria-live="polite" hidden></div>
<script>
(function(){
// Entity: Perlen, Farben, Techniken und Maße (S-001, Rechenmodell). Keine Abhängigkeiten, kein Plattformzugriff.
var Perlen = globalThis.Perlen = globalThis.Perlen || {};
Perlen.entity = (function () {
  const FARBEN = [
    { name: 'Rot', hex: '#d62839' }, { name: 'Koralle', hex: '#f26b5b' }, { name: 'Orange', hex: '#f39237' },
    { name: 'Gelb', hex: '#f6c945' }, { name: 'Grün', hex: '#3fa34d' }, { name: 'Mint', hex: '#8fd9b6' },
    { name: 'Türkis', hex: '#1fb5b0' }, { name: 'Himmelblau', hex: '#5aa9e6' }, { name: 'Nazarblau', hex: '#1d4fa8' },
    { name: 'Nachtblau', hex: '#1b2a4a' }, { name: 'Lila', hex: '#8a4fbf' }, { name: 'Rosa', hex: '#f4a6c1' },
    { name: 'Weiß', hex: '#f7f5ef' }, { name: 'Perlmutt', hex: '#e9dccb' }, { name: 'Gold', hex: '#d4a72c', metall: true },
    { name: 'Silber', hex: '#b9c0c8', metall: true }, { name: 'Schwarz', hex: '#1c1c1f' }, { name: 'Braun', hex: '#8b5a3c' }
  ];
  const FORMEN = { rund: 'Rund', rondelle: 'Rondelle', wuerfel: 'Buchstabe' };
  const GROESSEN = [4, 6, 8, 10];
  const TECHNIKEN = {
    gummi: { name: 'Gummiband', zugabe: 10, verschluss: 0, raster: false },
    faden: { name: 'Schmuckfaden mit Verschluss', zugabe: 15, verschluss: 15, raster: false },
    peyote: { name: 'Peyote mit Nadel', zugabe: 15, verschluss: 20, raster: true },
    loom: { name: 'Webrahmen', zugabe: 15, verschluss: 20, raster: true }
  };
  const DELICA = { breite: 1.3, laenge: 1.6, proGramm: 190 };
  const STRANG = { 4: 100, 6: 66, 8: 50, 10: 40 };
  const KLEMMEN = [10, 13, 16, 20, 25, 30];
  const WUERFEL_MM = 6;
  const BUCHSTABEN = /[A-ZÄÖÜ]/;

  function zahl(v) {
    if (v === null || v === undefined || v === '' || typeof v === 'boolean') return NaN;
    return Number(v);
  }
  // Klemmt auf [min, max]; Unsinn (Text, NaN, unendlich) wird zum Standardwert.
  function klemme(v, min, max, standard) {
    const n = zahl(v);
    if (!isFinite(n)) return standard;
    return Math.min(max, Math.max(min, Math.round(n)));
  }
  function perlenLaenge(p) {
    if (p.buchstabe || p.form === 'wuerfel') return WUERFEL_MM;
    return p.form === 'rondelle' ? Math.round(p.groesse * 0.6 * 10) / 10 : p.groesse;
  }
  function istRaster(technik) { return !!(TECHNIKEN[technik] && TECHNIKEN[technik].raster); }
  // FNV-1a über einen Text; für Prüfsummen der Geometrie (Wiederholbarkeit, PS-16).
  function pruefsumme(text) {
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16);
  }
  // FNV-1a-Art über ganze Zahlen (je Zahl ein Schritt).
  function pruefsummeZahlen(zahlen) {
    let h = 0x811c9dc5;
    for (const z of zahlen) { h ^= z | 0; h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16);
  }

  return {
    FARBEN, FORMEN, GROESSEN, TECHNIKEN, DELICA, STRANG, KLEMMEN, WUERFEL_MM, BUCHSTABEN,
    FORMAT: 1, UMFANG_MIN: 120, UMFANG_MAX: 240, UMFANG_STANDARD: 165,
    MUSTER_MAX: 40, NAME_MAX: 12, PERLEN_MAX: 400, SPALTEN_MIN: 4, SPALTEN_MAX: 16,
    REIHEN_MIN: 1, REIHEN_MAX: 60, ENTWUERFE_MAX: 20, UNDO_TIEFE: 50,
    klemme, perlenLaenge, istRaster, pruefsumme, pruefsummeZahlen
  };
})();

})();

(function(){
// Control: Rechenkern (S-001, Rechenmodell). Reine Funktionen: Perlenfolge, Raster, Einkaufsliste, Listentext.
var Perlen = globalThis.Perlen = globalThis.Perlen || {};
Perlen.control = Perlen.control || {};
Perlen.control.rechner = (function () {
  const E = Perlen.entity;
  const WEISS = 12;

  // Perlenstrecke P in mm: Umfang + Zugabe - Verschluss.
  function strecke(e) {
    const t = E.TECHNIKEN[e.technik] || E.TECHNIKEN.gummi;
    return e.umfang + t.zugabe - t.verschluss;
  }

  function mitte(e) {
    return Array.from(e.name || '').map(b => ({ farbe: WEISS, groesse: E.WUERFEL_MM, form: 'wuerfel', buchstabe: b }));
  }

  // Aufgefädelt: Muster wiederholen; eine Perle kommt dazu, solange die Summe höchstens P + ihre halbe Länge ist.
  function folge(e) {
    if (E.istRaster(e.technik) || !e.muster.length) return [];
    const m = mitte(e);
    const rest = strecke(e) - m.reduce((s, p) => s + E.perlenLaenge(p), 0);
    const seq = [];
    let summe = 0;
    for (let k = 0; seq.length < E.PERLEN_MAX - m.length; k++) {
      const p = e.muster[k % e.muster.length], l = E.perlenLaenge(p);
      if (summe + l > rest + l / 2) break;
      seq.push({ farbe: p.farbe, groesse: p.groesse, form: p.form });
      summe += l;
    }
    const i = Math.floor(seq.length / 2);
    return seq.slice(0, i).concat(m, seq.slice(i));
  }

  // Raster (Peyote, Webrahmen): Reihen R = aufrunden(P / 1,6), Muster wiederholt sich über die Reihen.
  function raster(e) {
    const r = e.raster, reihen = Math.ceil(strecke(e) / E.DELICA.laenge - 1e-9);
    const zelle = (z, s) => r.zellen[(z % r.reihen) * r.spalten + s];
    const zaehlung = {};
    for (let z = 0; z < reihen; z++) for (let s = 0; s < r.spalten; s++) { const c = zelle(z, s); zaehlung[c] = (zaehlung[c] || 0) + 1; }
    return { reihen, spalten: r.spalten, breite: r.spalten * E.DELICA.breite, zaehlung, zelle };
  }

  function bestellmenge(n) { return n > 0 ? Math.max(Math.ceil(n * 1.1 - 1e-9), n + 2) : 0; }
  const auf10cm = mm => Math.ceil(mm / 100 - 1e-9) * 10;
  const farbname = i => E.FARBEN[i].name;

  function perlenPositionen(e) {
    if (E.istRaster(e.technik)) {
      const z = raster(e).zaehlung;
      return Object.keys(z).map(Number).sort((a, b) => a - b).map(f => {
        const bestellen = bestellmenge(z[f]);
        return { id: 'delica-' + f, name: 'Delica 11/0 ' + farbname(f), farbe: f, groesse: 1.6, form: 'delica', anzahl: z[f], bestellen,
          gramm: Math.max(1, Math.ceil(bestellen / E.DELICA.proGramm)), packung: Math.max(1, Math.ceil(bestellen / E.DELICA.proGramm)) + ' g' };
      });
    }
    const gruppen = new Map();
    for (const p of folge(e)) {
      const id = p.buchstabe ? 'buchstabe-' + p.buchstabe : 'perle-' + p.farbe + '-' + p.groesse + '-' + p.form;
      if (!gruppen.has(id)) gruppen.set(id, { id, farbe: p.farbe, groesse: p.groesse, form: p.form, buchstabe: p.buchstabe, anzahl: 0 });
      gruppen.get(id).anzahl++;
    }
    const alle = Array.from(gruppen.values());
    const perlen = alle.filter(g => !g.buchstabe).map(g => {
      g.bestellen = bestellmenge(g.anzahl);
      g.name = farbname(g.farbe) + ', ' + E.FORMEN[g.form] + ' ' + g.groesse + ' mm';
      const st = Math.ceil(g.bestellen / E.STRANG[g.groesse]);
      g.packung = st + (st === 1 ? ' Strang' : ' Stränge') + ' (je etwa ' + E.STRANG[g.groesse] + ' Stück)';
      return g;
    });
    // Buchstaben: eine Zeile mit genauer Zahl je Buchstabe; die Reserve steckt im ABC-Mischbeutel (Hinweis)
    const b = alle.filter(g => g.buchstabe);
    if (b.length) {
      const n = b.reduce((s, g) => s + g.anzahl, 0);
      perlen.push({ id: 'buchstaben-' + b.map(g => g.buchstabe + g.anzahl).join(''), farbe: WEISS, groesse: E.WUERFEL_MM, form: 'wuerfel', buchstabe: true,
        je: b.map(g => ({ buchstabe: g.buchstabe, anzahl: g.anzahl })), anzahl: n, bestellen: n,
        name: 'Buchstabenwürfel 6 mm: ' + b.map(g => g.buchstabe + ' ' + g.anzahl).join(', '), packung: 'ABC-Mischbeutel' });
    }
    return perlen;
  }

  // Passt das Rastermuster glatt in die Reihenzahl? Sonst Vorschlag für den nächsten Umfang mit ganzer Wiederholung.
  function musterPasst(e) {
    if (!E.istRaster(e.technik)) return { glatt: true, wiederholungen: 0, vorschlag: null };
    const mr = e.raster.reihen, R0 = raster(e).reihen;
    const glatt = R0 % mr === 0;
    let vorschlag = null;
    if (!glatt) for (let d = 1; d <= 120 && vorschlag === null; d++) for (const u of [e.umfang + d, e.umfang - d]) {
      if (vorschlag === null && u >= E.UMFANG_MIN && u <= E.UMFANG_MAX && raster(Object.assign({}, e, { umfang: u })).reihen % mr === 0) vorschlag = u;
    }
    return { glatt, wiederholungen: Math.round(R0 / mr * 10) / 10, vorschlag };
  }

  function klemmbreite(b) {
    const k = E.KLEMMEN.find(x => x >= b - 1e-9);
    return k || E.KLEMMEN[E.KLEMMEN.length - 1];
  }

  const WERKZEUG = {
    gummi: ['Schere', 'Schmuckkleber oder klarer Nagellack', 'Perlenstopper oder Klammer', 'Perlenmatte oder Schale'],
    faden: ['Seitenschneider', 'Quetschzange oder Flachzange', 'Perlenstopper oder Klammer', 'Perlenmatte oder Schale'],
    peyote: ['Perlennadel Größe 10 oder 12', 'Schere', 'Fadenwachs', 'Perlenmatte', 'Flachzange für die Klemmenden'],
    loom: ['Perlenwebrahmen', 'Perlennadel Größe 10 oder 12 (lang)', 'Schere', 'Perlenmatte', 'Flachzange für die Klemmenden']
  };

  function einkauf(e) {
    const P = strecke(e), hinweise = [];
    const perlen = perlenPositionen(e);
    const faden = [], verschluss = [];
    if (E.istRaster(e.technik)) {
      const r = raster(e);

      if (!mp.glatt) hinweise.push('Das Muster wiederholt sich ' + mp.wiederholungen.toLocaleString('de-DE') + ' mal und bricht am Verschluss ab' + (mp.vorschlag ? '; glatt wird es bei ' + (mp.vorschlag / 10).toLocaleString('de-DE') + ' cm Handgelenk.' : '.'));
      if (e.technik === 'peyote') {
        if (r.spalten % 2) hinweise.push('Peyote mit ungerader Spaltenzahl braucht am Rand eine besondere Wende; für den Anfang ist eine gerade Zahl einfacher.');
        faden.push({ id: 'faden-peyote', name: 'Perlenfaden (Nymo oder Miyuki), etwa', cm: auf10cm(r.reihen * 2 * (r.breite + 3) + 600) });
      } else {
        faden.push({ id: 'faden-kette', name: 'Kettfäden: ' + (r.spalten + 1) + ' Fäden, zusammen etwa', cm: auf10cm((r.spalten + 1) * (P + 600)) });
        faden.push({ id: 'faden-schuss', name: 'Schussfaden (Perlenfaden), etwa', cm: auf10cm(r.reihen * (2 * r.breite + 10) + 600) });
      }
      const k = klemmbreite(r.breite);
      verschluss.push({ id: 'klemmen', name: 'Klemmenden ' + k + ' mm', anzahl: 2 }, { id: 'karabiner', name: 'Karabiner', anzahl: 1 },
        { id: 'biegering', name: 'Biegeringe 5 mm', anzahl: 2 });
    } else {
      faden.push(e.technik === 'gummi'
        ? { id: 'faden-gummi', name: 'Gummiband 0,8 mm', cm: auf10cm(P + 200) }
        : { id: 'faden-schmuck', name: 'Schmuckfaden 0,38 mm (nylonummantelt)', cm: auf10cm(P + 200) });
      if (e.technik === 'faden') verschluss.push({ id: 'karabiner', name: 'Karabiner', anzahl: 1 }, { id: 'biegering', name: 'Biegering 5 mm', anzahl: 1 },
        { id: 'quetsch', name: 'Quetschperlen 2 mm', anzahl: 2 }, { id: 'kaschier', name: 'Kaschierperlen', anzahl: 2 });
      if (!e.muster.length) hinweise.push('Muster leer: füge im Designer Perlen hinzu.');
    }
    if (!E.istRaster(e.technik) && e.name) hinweise.push('Buchstabenwürfel gibt es als ABC-Mischbeutel. Achte darauf, dass jeder Buchstabe deines Namens mindestens so oft drin ist wie angegeben, plus einer Reserve.');
    if (E.istRaster(e.technik)) hinweise.push('Faden in Stücken von höchstens 1,5 m verarbeiten und nachsetzen, wenn er kurz wird; die Länge oben ist die Gesamtmenge.');
    if (e.technik === 'gummi') hinweise.push('Kein Verschluss nötig: Gummiband mit doppeltem Knoten schließen und mit Kleber sichern.');
    hinweise.push('Fadenlängen sind großzügige Schätzwerte. Reserve bei Perlen: 10 %, mindestens 2.');
    const werkzeug = WERKZEUG[e.technik].map((name, i) => ({ id: 'werkzeug-' + e.technik + '-' + i, name }));
    return { technik: e.technik, strecke: P, perlen, faden, verschluss, werkzeug, hinweise };
  }

  function listenText(ek, titel) {
    const z = ['Einkaufsliste: ' + titel, 'Technik: ' + E.TECHNIKEN[ek.technik].name, ''];
    z.push('Perlen:');
    if (!ek.perlen.length) z.push('- keine');
    for (const p of ek.perlen) z.push('- ' + p.bestellen + ' x ' + p.name + ' (gebraucht ' + p.anzahl + ', ' + p.packung + ')');
    z.push('', 'Faden:');
    for (const f of ek.faden) z.push('- ' + f.name + ' ' + f.cm + ' cm');
    z.push('', 'Verschluss:');
    if (!ek.verschluss.length) z.push('- keiner (Knoten)');
    for (const v of ek.verschluss) z.push('- ' + v.anzahl + ' x ' + v.name);
    z.push('', 'Werkzeug:');
    for (const w of ek.werkzeug) z.push('- ' + w.name);
    return z.join('\n');
  }

  return { strecke, folge, raster, bestellmenge, einkauf, listenText, klemmbreite, musterPasst };
})();

(function(){
// Control: Entwurf des Designers (S-001). Bereinigen (Klemmen manipulierter Daten), Änderungen, Rückgängig.
// Jede Funktion gibt einen neuen, bereinigten Entwurf zurück; der alte bleibt unverändert.
var Perlen = globalThis.Perlen = globalThis.Perlen || {};
Perlen.control = Perlen.control || {};
Perlen.control.entwurf = (function () {
  const E = Perlen.entity;
  const kopie = x => JSON.parse(JSON.stringify(x));
  const ganz = (v, n, standard) => (Number.isInteger(v) && v >= 0 && v < n ? v : standard);

  function perle(p) {
    p = p && typeof p === 'object' ? p : {};
    return {
      farbe: ganz(p.farbe, E.FARBEN.length, 0),
      groesse: E.GROESSEN.includes(p.groesse) ? p.groesse : 6,
      form: p.form === 'rondelle' ? 'rondelle' : 'rund'
    };
  }

  function name(v) {
    if (typeof v !== 'string') return '';
    // ß wird SS, Akzente fallen weg (É wird E), Ä Ö Ü bleiben; alles andere fällt weg.
    const ohneAkzent = b => (E.BUCHSTABEN.test(b) ? b : b.normalize('NFD').charAt(0));
    return Array.from(v.replace(/ß/g, 'SS').toUpperCase()).map(ohneAkzent).filter(b => E.BUCHSTABEN.test(b)).slice(0, E.NAME_MAX).join('');
  }

  // Fehlt das Raster (zum Beispiel bei einer aufgefädelten Idee), entsteht es aus den Farben des Musters als Schrägstreifen,
  // damit ein Technikwechsel kein einfarbiges Band liefert (Korrekturrunde 2).
  function rasterAusFarben(farben, spalten, reihen) {
    const f = farben.length ? farben : [6, 13];
    const zellen = [];
    for (let z = 0; z < reihen; z++) for (let s = 0; s < spalten; s++) zellen.push(f[Math.floor((z + s) / 2) % f.length]);
    return zellen;
  }
  function verschieden(liste) { return liste.filter((x, i) => liste.indexOf(x) === i); }

  function raster(r, musterFarben) {
    r = r && typeof r === 'object' ? r : {};
    const leer = !Array.isArray(r.zellen) || !r.zellen.length;
    const spalten = E.klemme(r.spalten, E.SPALTEN_MIN, E.SPALTEN_MAX, 8);
    const reihen = E.klemme(r.reihen, E.REIHEN_MIN, E.REIHEN_MAX, 8);
    const alt = leer ? rasterAusFarben(musterFarben, spalten, reihen) : r.zellen;
    const zellen = [];
    for (let k = 0; k < spalten * reihen; k++) zellen.push(ganz(alt[k], E.FARBEN.length, 0));
    return { spalten, reihen, zellen };
  }

  function bereinige(roh) {
    const e = roh && typeof roh === 'object' && !Array.isArray(roh) ? roh : {};
    const b = {
      titel: typeof e.titel === 'string' ? e.titel.slice(0, 40) : '',
      technik: Object.prototype.hasOwnProperty.call(E.TECHNIKEN, e.technik) ? e.technik : 'gummi',
      umfang: E.klemme(e.umfang, E.UMFANG_MIN, E.UMFANG_MAX, E.UMFANG_STANDARD),
      name: name(e.name),
      muster: [],
      raster: null
    };
    // fehlt das Muster ganz (Raster-Idee), entsteht es aus den Rasterfarben; ein leeres Muster [] bleibt leer
    b.muster = Array.isArray(e.muster) ? e.muster.slice(0, E.MUSTER_MAX).map(perle) : null;
    b.raster = raster(e.raster, verschieden((b.muster || []).map(p => p.farbe)).slice(0, 4));
    if (!b.muster) b.muster = verschieden(b.raster.zellen).slice(0, 3).map(f => ({ farbe: f, groesse: 6, form: 'rund' }));
    return b;
  }

  function neu(technik) {
    return bereinige({
      technik,
      muster: [{ farbe: 6, groesse: 8 }, { farbe: 13, groesse: 4 }, { farbe: 14, groesse: 6, form: 'rondelle' }, { farbe: 13, groesse: 4 }],
      raster: { spalten: 8, reihen: 4, zellen: [6, 6, 13, 13, 13, 13, 6, 6, 13, 6, 6, 13, 13, 6, 6, 13, 13, 13, 6, 6, 6, 6, 13, 13, 13, 6, 6, 13, 13, 6, 6, 13] }
    });
  }

  const mit = (e, f) => { const k = kopie(e); f(k); return bereinige(k); };
  const perleAnfuegen = (e, p) => mit(e, k => { if (k.muster.length < E.MUSTER_MAX) k.muster.push(perle(p)); });
  const letztePerleWeg = e => mit(e, k => { k.muster.pop(); });
  const perleEntfernen = (e, i) => mit(e, k => { if (i >= 0 && i < k.muster.length) k.muster.splice(i, 1); });
  const setzeUmfang = (e, mm) => mit(e, k => { k.umfang = E.klemme(mm, E.UMFANG_MIN, E.UMFANG_MAX, E.UMFANG_STANDARD); });
  const setzeName = (e, n) => mit(e, k => { k.name = name(n); });
  const setzeTechnik = (e, t) => mit(e, k => { k.technik = t; });
  const setzeTitel = (e, t) => mit(e, k => { k.titel = t; });

  // Spalten oder Musterreihen ändern: vorhandene Felder bleiben an ihrem Platz (Reihe, Spalte).
  function groesse(e, spalten, reihen) {
    return mit(e, k => {
      const alt = k.raster, s = E.klemme(spalten, E.SPALTEN_MIN, E.SPALTEN_MAX, alt.spalten), r = E.klemme(reihen, E.REIHEN_MIN, E.REIHEN_MAX, alt.reihen);
      const zellen = [];
      for (let z = 0; z < r; z++) for (let x = 0; x < s; x++) zellen.push(z < alt.reihen && x < alt.spalten ? alt.zellen[z * alt.spalten + x] : (x < alt.spalten ? alt.zellen[(z % alt.reihen) * alt.spalten + x] : 0));
      k.raster = { spalten: s, reihen: r, zellen };
    });
  }
  const setzeSpalten = (e, s) => groesse(e, s, e.raster.reihen);
  const setzeMusterreihen = (e, r) => groesse(e, e.raster.spalten, r);
  const malFeld = (e, reihe, spalte, farbe) => mit(e, k => {
    if (reihe >= 0 && reihe < k.raster.reihen && spalte >= 0 && spalte < k.raster.spalten) k.raster.zellen[reihe * k.raster.spalten + spalte] = farbe;
  });
  const fuelleRaster = (e, farbe) => mit(e, k => { k.raster.zellen = k.raster.zellen.map(() => farbe); });

  // Verlauf mit Rückgängig (A-8): bis UNDO_TIEFE Schritte; gleiche Zustände zählen nicht als Schritt (PS-5).
  function verlauf(start) {
    let jetzt = bereinige(start);
    const zurueck = [];
    let offen = null;
    return {
      zustand: () => kopie(jetzt),
      // gruppe: aufeinanderfolgende Änderungen derselben Gruppe (Name tippen, Regler ziehen) sind ein Rückgängig-Schritt,
      // bis schliesse() die Gruppe beendet (Korrekturrunde 3).
      aendere(fn, gruppe) {
        const neuer = bereinige(fn(kopie(jetzt)));
        if (JSON.stringify(neuer) === JSON.stringify(jetzt)) return false;
        if (!(gruppe && gruppe === offen && zurueck.length)) { zurueck.push(jetzt); if (zurueck.length > E.UNDO_TIEFE) zurueck.shift(); }
        offen = gruppe || null;
        jetzt = neuer;
        return true;
      },
      schliesse() { offen = null; },
      setze(e) { return this.aendere(() => e); },
      // ersetzt den Zustand ohne Rückgängig-Schritt (zum Beispiel Titel beim Speichern)
      ersetze(e) { jetzt = bereinige(e); },
      rueckgaengig() { offen = null; if (!zurueck.length) return false; jetzt = zurueck.pop(); return true; },
      kannZurueck: () => zurueck.length > 0
    };
  }

  return { bereinige, neu, verlauf, perleAnfuegen, letztePerleWeg, perleEntfernen, setzeUmfang, setzeName, setzeTechnik, setzeTitel,
    setzeSpalten, setzeMusterreihen, malFeld, fuelleRaster };
})();

})();

(function(){
// Control: Ringgeometrie der Vorschau (S-001, A-5). Reine Funktion: Perlen mit Lage, Größe und Tiefe,
// sortiert von hinten nach vorn, damit die UI nur noch der Reihe nach zeichnet.
var Perlen = globalThis.Perlen = globalThis.Perlen || {};
Perlen.control = Perlen.control || {};
Perlen.control.ring = (function () {
  const E = Perlen.entity, R = Perlen.control.rechner;
  const NEIGUNG = 0.42;   // Verhältnis der Ellipsenachsen: Ring liegt schräg vor dem Betrachter

  function rahmen(breite, hoehe, bandHoehe) {
    const rx = Math.min(breite * 0.38, (hoehe - bandHoehe) * 0.9);
    return { cx: breite / 2, cy: hoehe * 0.43, rx, ry: rx * NEIGUNG };
  }
  // Perspektive: hinten etwas kleiner und dunkler (tiefe -1 hinten, +1 vorn)
  const massstab = tiefe => 0.86 + 0.14 * (tiefe + 1) / 2;

  function aufgefaedelt(e, breite, hoehe) {
    const f = R.folge(e);
    const laengen = f.map(E.perlenLaenge), gesamt = laengen.reduce((a, b) => a + b, 0) || 1;
    const r0 = rahmen(breite, hoehe, 0);
    const s = (2 * Math.PI * r0.rx) / gesamt;   // Pixel je Millimeter entlang des Rings
    let lauf = 0;
    return { ring: r0, mmPx: s, perlen: f.map((p, i) => {
      // Anfang hinten, Mitte (Name) vorn; vorn läuft die Folge von links nach rechts, damit der Name lesbar ist
      const w = 1.5 * Math.PI - 2 * Math.PI * (lauf + laengen[i] / 2) / gesamt;
      lauf += laengen[i];
      const tiefe = Math.sin(w), k = massstab(tiefe);
      return { x: r0.cx + r0.rx * Math.cos(w), y: r0.cy + r0.ry * Math.sin(w), r: (p.groesse / 2) * s * k, laenge: laengen[i] * s * k,
        winkel: w, tiefe, farbe: p.farbe, form: p.form, buchstabe: p.buchstabe || '', reihe: i, spalte: 0, versatz: 0 };
    }) };
  }

  function raster(e, breite, hoehe) {
    const r = R.raster(e), P = R.strecke(e);
    const r0 = rahmen(breite, hoehe, 0);
    const s = (2 * Math.PI * r0.rx) / P;
    const bandHoehe = r.breite * s;
    const versetzt = e.technik === 'peyote';
    const perlen = [];
    for (let z = 0; z < r.reihen; z++) for (let sp = 0; sp < r.spalten; sp++) {
      const versatz = versetzt && sp % 2 === 1 ? 0.5 : 0;
      const w = 1.5 * Math.PI - 2 * Math.PI * (z + 0.5 + versatz) / r.reihen;   // vorn wie im Editor: Reihen nach rechts
      const tiefe = Math.sin(w), k = massstab(tiefe);
      perlen.push({ x: r0.cx + r0.rx * Math.cos(w), y: r0.cy + r0.ry * Math.sin(w) + (sp - (r.spalten - 1) / 2) * E.DELICA.breite * s * 0.92,
        r: (E.DELICA.breite / 2) * s * k, laenge: E.DELICA.laenge * s * k, winkel: w, tiefe, farbe: r.zelle(z, sp), form: 'delica', buchstabe: '',
        reihe: z, spalte: sp, versatz });
    }
    return { ring: r0, mmPx: s, bandHoehe, perlen };
  }

  function geometrie(entwurf, breite, hoehe) {
    const g = E.istRaster(entwurf.technik) ? raster(entwurf, breite, hoehe) : aufgefaedelt(entwurf, breite, hoehe);
    // stabile Sortierung von hinten nach vorn (Index als zweiter Schlüssel)
    const n = g.perlen.length, idx = new Array(n);
    for (let i = 0; i < n; i++) idx[i] = i;
    const alt = g.perlen;
    idx.sort((a, b) => (alt[a].tiefe - alt[b].tiefe) || (a - b));
    g.perlen = idx.map(i => alt[i]);
    return g;
  }

  // Prüfsumme der Geometrie (Wiederholbarkeit, PS-16); getrennt, damit das Zeichnen sie nicht bezahlt.
  function pruefsumme(g) {
    const zahlen = [];
    for (const p of g.perlen) zahlen.push(Math.round(p.x * 1000), Math.round(p.y * 1000), Math.round(p.r * 1000), p.farbe, p.buchstabe ? p.buchstabe.charCodeAt(0) : 0);
    return E.pruefsummeZahlen(zahlen);
  }

  return { geometrie, pruefsumme };
})();

})();

(function(){
// Control: Entwürfe und Haken im Gerät (S-001, A-9, R-07 Formatversion). Speicher und Teilen kommen als Boundary-Objekte herein.
// Kaputte oder fremde Daten: leer anfangen, den alten Text nicht anfassen, bis der Nutzer speichert; dann wird er gesichert.
var Perlen = globalThis.Perlen = globalThis.Perlen || {};
Perlen.control = Perlen.control || {};
Perlen.control.sitzung = (function () {
  const E = Perlen.entity, W = Perlen.control.entwurf;
  const SCHLUESSEL = 'perlenwerkstatt';

  function erzeuge(speicher, teilen) {
    let daten = { format: E.FORMAT, entwuerfe: [], haken: {} };
    let fremd = null, geladen = false, ok = true;

    function lies() {
      try { return speicher.lies(SCHLUESSEL); } catch (x) { ok = false; return null; }
    }
    function laden() {
      geladen = true; ok = true; fremd = null;
      daten = { format: E.FORMAT, entwuerfe: [], haken: {} };
      const roh = lies();
      if (roh === null || roh === undefined) return ergebnis();
      let d = null;
      try { d = JSON.parse(roh); } catch (x) { d = null; }
      if (!d || typeof d !== 'object' || Array.isArray(d) || d.format !== E.FORMAT || !Array.isArray(d.entwuerfe)) { fremd = roh; return ergebnis(); }
      daten.entwuerfe = d.entwuerfe.slice(-E.ENTWUERFE_MAX).map(W.bereinige);
      if (d.haken && typeof d.haken === 'object' && !Array.isArray(d.haken))
        for (const k of Object.keys(d.haken)) if (d.haken[k] === true && k.length < 80) daten.haken[k] = true;
      return ergebnis();
    }
    function ergebnis() { return { ok, fremd: fremd !== null, entwuerfe: JSON.parse(JSON.stringify(daten.entwuerfe)), haken: Object.assign({}, daten.haken) }; }
    function schreibe() {
      try {
        if (fremd !== null) { if (speicher.schreibe(SCHLUESSEL + '.alt', fremd) === false) return false; fremd = null; }
        return speicher.schreibe(SCHLUESSEL, JSON.stringify(daten)) !== false;
      } catch (x) { return false; }
    }
    const vorher = () => { if (!geladen) laden(); };

    function speichere(entwurf) {
      vorher();
      const e = W.bereinige(entwurf), text = JSON.stringify(e);
      daten.entwuerfe = daten.entwuerfe.filter(x => JSON.stringify(x) !== text);
      daten.entwuerfe.push(e);
      if (daten.entwuerfe.length > E.ENTWUERFE_MAX) daten.entwuerfe.shift();
      return schreibe();
    }
    function loesche(index) {
      vorher();
      if (!(index >= 0 && index < daten.entwuerfe.length)) return false;
      daten.entwuerfe.splice(index, 1);
      return schreibe();
    }
    function hakeAb(id, wert) {
      vorher();
      if (wert) daten.haken[id] = true; else delete daten.haken[id];
      if (fremd !== null) return false;   // fremde Daten nicht überschreiben, nur weil ein Haken gesetzt wurde
      return schreibe();
    }
    function teile(titel, text) {
      if (!teilen) return Promise.resolve('fehler');
      return teilen.teile(titel, text);
    }
    function kopiere(text) {
      if (!teilen) return Promise.resolve('fehler');
      return teilen.kopiere(text);
    }
    // aktueller Stand im Speicher der Seite, ohne neu zu lesen (Haken bleiben auch ohne Gerätespeicher erhalten)
    function stand() { vorher(); return ergebnis(); }
    return { laden, stand, speichere, loesche, hakeAb, teile, kopiere };
  }

  // Start aus der UI: Boundary-Objekte für das Fenster bauen.
  function starte(fenster) {
    return erzeuge(Perlen.boundary.speicher.erzeuge(fenster), Perlen.boundary.teilen.erzeuge(fenster));
  }

  return { SCHLUESSEL, erzeuge, starte };
})();

})();

  function anleitung() {
    const z = app.zustand, AL = Perlen.control.anleitung, a = AL.fuer(z.anleitung), BILD = Perlen.ui.anleitungsbild;
    const kontext = Perlen.control.szenen.kontext(z.verlauf.zustand());
    bereiche.anleitung.replaceChildren(
      el('h2', {}, 'Anleitung'),
      B.wahl(K.techniken().map(t => ({ id: t.id, name: TECHNIK_KURZ[t.id] })), z.anleitung, t => { z.anleitung = t; zeichne('anleitung'); }, 'Technik der Anleitung', true),
      el('div', { class: 'block' }, el('h3', {}, 'Handgelenk messen'), BILD.erzeuge(AL.messbild(), kontext),
        el('ol', { class: 'schritte', id: 'messen' }, AL.messen().map(s => el('li', {}, s)))),
      el('div', { class: 'block' }, el('h2', {}, a.titel), el('p', { class: 'hinweis' }, 'Die Bilder zeigen dein Armband aus dem Designer. Tippe auf ein Bild, um es anzuhalten oder abzuspielen.'),
        el('ol', { class: 'schritte', id: 'schritte' }, a.schritte.map((s, i) => el('li', {}, el('span', {}, s), BILD.erzeuge(a.bilder[i], kontext))))),
      el('div', { class: 'block' }, el('h3', {}, 'Tipps gegen typische Fehler'), el('ul', { class: 'tipps', id: 'tipps' }, a.tipps.map(s => el('li', {}, s)))));
    BILD.aufraeumen();   // alte Bilder der vorigen Technik loslassen
  }

  function zeichne(r) {
    if (r === 'ideen') ideen(); else if (r === 'einkauf') einkauf(); else if (r === 'anleitung') anleitung(); else designer.baue();
  }

  function zeige(r) {
    app.zustand.reiter = r;
    for (const x of REITER) { bereiche[x.id].hidden = x.id !== r; if (x.id === r) reiterKnoepfe[x.id].setAttribute('aria-current', 'page'); else reiterKnoepfe[x.id].removeAttribute('aria-current'); }
    zeichne(r);
    fenster.scrollTo(0, 0);
  }

  function oeffne(e) {
    if (app.zustand.reiter !== 'designer') zeige('designer');
    designer.oeffne(e);
  }

  // Gerätespeicher nur beim Start lesen; danach gilt der Stand der Sitzung (Haken bleiben auch ohne Speicher, Korrekturrunde 3)
  function lade() {
    const d = sitzung.laden();
    app.zustand.daten = d; app.zustand.speicherOk = d.ok;
    return d;
  }
  function auffrischen() { app.zustand.daten = sitzung.stand(); }
  function kurzinfo(e) {
    const n = K.istRaster(e.technik) ? R.raster(e).reihen * e.raster.spalten : R.folge(e).length;
    return n + ' Perlen · Handgelenk ' + (e.umfang / 10).toLocaleString('de-DE') + ' cm';
  }

  app.speichere = function () {
    const z = app.zustand; let e = z.verlauf.zustand();
    if (!e.titel) {
      let n = z.daten.entwuerfe.length + 1; while (z.daten.entwuerfe.some(x => x.titel === 'Mein Armband ' + n)) n++;
      e = W.setzeTitel(e, 'Mein Armband ' + n); z.verlauf.ersetze(e);
    }
    if (sitzung.speichere(e)) B.melde('Gespeichert als "' + e.titel + '"'); else B.melde('Nicht gespeichert: dieser Browser erlaubt kein Speichern');
    auffrischen();
  };
  app.zeige = zeige;
  app.jetzt = () => fenster.performance.now();

  app.starte = function (f) {
    fenster = f; app.dokument = f.document; B.setzeDokument(f.document); Perlen.ui.anleitungsbild.setze(f);
    sitzung = Perlen.control.sitzung.starte(f);
    const z = app.zustand;
    lade();
    const start = Perlen.control.ideen.liste()[0].entwurf;
    z.verlauf = W.verlauf(start);
    for (const r of REITER) bereiche[r.id] = el('section', { id: 'bereich-' + r.id, 'aria-label': r.name, class: 'stapel', hidden: true });
    const nav = el('nav', { class: 'reiter', 'aria-label': 'Bereiche' }, el('div', {}, REITER.map(r => (reiterKnoepfe[r.id] =
      el('button', { type: 'button', 'data-reiter': r.id, onclick: () => zeige(r.id) }, B.icon(r.id), r.name)))));
    f.document.getElementById('app').replaceChildren(
      el('div', { class: 'seite' }, el('header', { class: 'kopf' }, el('h1', {}, 'Perlen', el('span', {}, 'werkstatt')), document.querySelector('a.ng-zurueck')),
        REITER.map(r => bereiche[r.id])), nav);
    designer = Perlen.ui.designer.erzeuge(app);
    designer.haenge(bereiche.designer);
    if (!z.speicherOk) B.melde('Speichern ist hier nicht möglich, alles andere geht');
    zeige('ideen');
  };
  return app;
})();

})();

Perlen.ui.app.starte(window);
</script>
</body>
</html>
