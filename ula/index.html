<script>// Reiner Regelkern für Demolition (S-D02). Keine Zeit, kein Zufall: beides wird hineingereicht (R-01).
(function (root) {
  "use strict";
  var K = {};
  var FACT = { rear: 1.5, side: 1.0, front: 0.5, wall: 0.25 };
  K.THRESHOLD = 3; K.SLOPE = 1.0; K.MAX_DAMAGE = 100;
  K.RING_START = 36; K.RING_MIN = 14; K.RING_HOLD = 8; K.RING_SHRINK = 60; K.RING_FINAL = 7; K.RING_FINAL_T = 40; K.FIRE_DPS = 12;
  K.COMBO_WINDOW = 4; K.COMBO_MAX = 5; K.KILL_POINTS = 100;
  K.SAVE_VERSION = 2;
  // Lackierungen: werden durch die beste erreichte Welle freigeschaltet (S-D03)
  K.SKINS = [{ id: "standard", wave: 0 }, { id: "neon", wave: 3 }, { id: "eis", wave: 6 }, { id: "chrom", wave: 9 }];
  K.CARDS = ["panzer", "rammbock", "turbo", "reparatur", "wendig", "stachel", "magnet", "schild"]; // S-D09: 3 neue
  K.CARD_MAX = 3;

  function num(v) { return typeof v === "number" && isFinite(v) ? v : 0; }
  K.angleFactor = function (deg) {
    deg = num(deg);
    return deg <= 45 ? FACT.rear : deg <= 135 ? FACT.side : FACT.front;
  };
  K.damage = function (relSpeed, deg, wall, mult) {
    var s = num(relSpeed); if (s <= K.THRESHOLD) return 0;
    var f = wall ? FACT.wall : K.angleFactor(deg);
    var m = mult === undefined ? 1 : num(mult);
    var d = (s - K.THRESHOLD) * K.SLOPE * f * Math.max(0, m);
    return Math.min(K.MAX_DAMAGE, d);
  };
  // Winkel zwischen der Rückrichtung des Opfers und der Richtung zum Angreifer: 0 = Angreifer genau hinter dem Opfer (Heck), 180 = genau davor (Front)
  K.hitAngle = function (hx, hy, nx, ny) {
    var l = Math.hypot(nx, ny), h = Math.hypot(hx, hy);
    if (!(l > 1e-9) || !(h > 1e-9)) return 90;
    var c = -(hx * nx + hy * ny) / (l * h);
    return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
  };
  K.ringRadius = function (t) {
    t = num(t); if (t <= K.RING_HOLD) return K.RING_START;
    var u = (t - K.RING_HOLD) / K.RING_SHRINK;
    if (u <= 1) return K.RING_START + (K.RING_MIN - K.RING_START) * u;
    var w = Math.min(1, (u - 1) * K.RING_SHRINK / K.RING_FINAL_T);
    return K.RING_MIN + (K.RING_FINAL - K.RING_MIN) * w;
  };
  // ---- S-D08: Boss-Welle ----
  K.BOSS = { every: 5, scale: 1.8, mass: 2.5, hp: 3, speed: 0.82, dmg: 1.2, bonus: 500, heal: 0.3, fewer: 2 };
  K.isBossWave = function (n) { return typeof n === "number" && isFinite(n) && Math.floor(n) === n && n >= K.BOSS.every && n % K.BOSS.every === 0; };
  K.waveSpec = function (n) {
    n = Math.max(1, Math.floor(num(n)) || 1);
    var boss = K.isBossWave(n) ? 1 : 0, base = Math.min(3 + n, 8);
    // S-D08: auf Boss-Wellen 2 Gegner weniger, mindestens 3
    var enemies = Math.max(3, base - (boss ? K.BOSS.fewer : 0));
    // S-D05: Brummer ab Welle 3; Gegnerstoß steigt, ab Welle 6 steiler, Deckel 2,1 ab Welle 13 (S-D06: 0,7-fach nach Messung mit 48 Läufen)
    return { enemies: enemies, aiSpeed: Math.min(0.58 + 0.04 * n, 1.0), boss: boss, heavy: n < 3 ? 0 : Math.min(4, enemies - boss, Math.floor((n - 1) / 2)),
      dmgMult: Math.min(2.1, Math.round((0.35 + 0.07 * n + 0.14 * Math.max(0, n - 6)) * 100) / 100) };
  };
  // Kombo: state = {chain, last}; liefert neuen Zustand und Faktor
  K.combo = function (state, now) {
    var chain = state && state.chain > 0 ? state.chain : 0, last = state ? num(state.last) : 0;
    now = num(now);
    var inWin = chain > 0 && now >= last && now - last <= K.COMBO_WINDOW;
    chain = inWin ? Math.min(K.COMBO_MAX, chain + 1) : 1;
    return { chain: chain, last: now, factor: chain, points: K.KILL_POINTS * chain };
  };
  // Reparaturpaket: heilt 30 % der Höchstwerte, nie über das Maximum; ungültige Werte ändern nichts
  K.REPAIR_FRAC = 0.3; K.ITEM_EVERY = 9; K.ITEM_MAX = 2;
  K.repair = function (hp, max) {
    hp = num(hp); max = num(max); if (max <= 0) return Math.max(0, hp);
    return Math.min(max, Math.max(0, hp) + max * K.REPAIR_FRAC);
  };
  K.slowmo = function (dmg, kill) {
    if (kill) return { scale: 0.3, dur: 0.4 };
    if (num(dmg) >= 15) return { scale: 0.25, dur: 0.18 };
    return { scale: 1, dur: 0 };
  };
  // owned: {karte: stufe}; rnd: () => [0,1)
  K.pickCards = function (owned, rnd) {
    owned = owned || {};
    var pool = K.CARDS.filter(function (c) { return num(owned[c]) < K.CARD_MAX; });
    var out = [];
    while (out.length < 3 && pool.length) {
      var i = Math.min(pool.length - 1, Math.floor(rnd() * pool.length));
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  };
  // Tägliche Herausforderung: gleicher Startwert für alle am selben Tag; Datum wird hineingereicht (R-01)
  K.dailySeed = function (y, m, d) {
    y = Math.floor(num(y)); m = Math.floor(num(m)); d = Math.floor(num(d));
    if (y < 2000 || y > 2200 || m < 1 || m > 12 || d < 1 || d > new Date(Date.UTC(y, m, 0)).getUTCDate()) return 0;
    return y * 10000 + m * 100 + d;
  };
  K.unlockedSkins = function (bestWave) {
    var w = Math.floor(num(bestWave));
    return K.SKINS.filter(function (s) { return w >= s.wave; }).map(function (s) { return s.id; });
  };
  // ungültige oder noch gesperrte Wahl ergibt "standard"
  K.validSkin = function (id, bestWave) { return K.unlockedSkins(bestWave).indexOf(id) >= 0 ? id : "standard"; };
  K.nextSkin = function (id, bestWave) {
    var l = K.unlockedSkins(bestWave), i = l.indexOf(id);
    return l[(i + 1) % l.length];
  };
  K.newUnlocks = function (oldWave, newWave) {
    var a = K.unlockedSkins(oldWave), b = K.unlockedSkins(newWave);
    return b.filter(function (id) { return a.indexOf(id) < 0; });
  };
  // ---- Spielverständnis, Aufgaben, Ziele (S-D04) ----
  K.QUESTS = [
    { id: "heck", n: "3 Heckschüsse", stat: "rear", goal: 3 }, { id: "seite", n: "5 Seitentreffer", stat: "side", goal: 5 },
    { id: "kombo", n: "Kombo ×3", stat: "combo", goal: 3 }, { id: "welle", n: "Welle 4 erreichen", stat: "wave", goal: 4 },
    { id: "punkte", n: "1500 Punkte", stat: "score", goal: 1500 }, { id: "feuer", n: "1 Gegner ins Feuer treiben", stat: "fire", goal: 1 }
  ];
  function quest(id) { for (var i = 0; i < K.QUESTS.length; i++) if (K.QUESTS[i].id === id) return K.QUESTS[i]; return null; }
  // 3 verschiedene Aufgaben, nur vom Startwert abhängig (ungültig = 0)
  K.questsFor = function (seed) {
    var x = Math.abs(Math.floor(num(seed))) % 2147483646 + 1, ids = K.QUESTS.map(function (q) { return q.id; });
    for (var i = ids.length - 1; i > 0; i--) { x = x * 48271 % 2147483647; var j = x % (i + 1), t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    return ids.slice(0, 3);
  };
  K.questValue = function (id, st) { var q = quest(id); return q && st ? num(st[q.stat]) : 0; };
  K.questDone = function (id, st) { var q = quest(id); return !!q && K.questValue(id, st) >= q.goal; };
  K.hitLabel = function (deg, wall, frontMul) {
    if (wall) return "WAND ×0,25";
    var f = K.angleFactor(deg); if (f === FACT.rear) return "HECK ×1,5"; if (f === FACT.side) return "SEITE ×1";
    var m = typeof frontMul === "number" && isFinite(frontMul) && frontMul > 0 ? frontMul : 1; // S-D09 Stachelbügel
    return "FRONT ×" + String(Math.round(FACT.front * m * 100) / 100).replace(".", ",");
  };
  // Nächstes großes Ziel: nächster gesperrter Lack, danach Wellenrekord
  K.nextGoal = function (bestWave) {
    var w = Math.floor(num(bestWave));
    for (var i = 0; i < K.SKINS.length; i++) if (K.SKINS[i].wave > w) return { kind: "skin", wave: K.SKINS[i].wave, skin: K.SKINS[i].id };
    return { kind: "rekord", wave: w + 1 };
  };
  // Lernhinweise: erster passender, noch nicht gezeigter Hinweis (oder null)
  var COACH = [
    ["start", function () { return true; }], ["faktor", function (s) { return num(s.hits) >= 1; }],
    ["boost", function (s) { return num(s.hits) >= 1 && num(s.boost) >= 60; }], ["ring", function (s) { return s.ring === true; }],
    ["kombo", function (s) { return num(s.kills) >= 1; }]
  ];
  K.coach = function (st, shown) {
    if (!st || typeof st !== "object") return null;
    var sh = Array.isArray(shown) ? shown : [];
    for (var i = 0; i < COACH.length; i++) if (sh.indexOf(COACH[i][0]) < 0 && COACH[i][1](st)) return COACH[i][0];
    return null;
  };
  // ---- S-D05: Dreher, Fässer, Brummer ----
  K.SPIN_TIME = 1.2; K.SPIN_MIN_DMG = 8; K.BARREL_R = 7; K.BARREL_DMG = 40;
  K.HEAVY = { mass: 1.5, hp: 1.5, speed: 0.88, scale: 1.25, dmg: 1.25 };
  // DUELL-Ansage: genau dann, wenn von mindestens 2 Gegnern nur noch 1 lebt und sie noch nicht kam
  K.duelDue = function (left, total, shown) { return !shown && num(total) >= 2 && num(left) === 1; };
  // 3 Fässer zwischen 12 und 20 m von der Mitte, mindestens 6 m auseinander; rnd wird hineingereicht (R-01)
  K.placeBarrels = function (rnd) {
    var out = [], r = typeof rnd === "function" ? rnd : function () { return 0.5; };
    for (var k = 0; k < 60 && out.length < 3; k++) {
      var a = num(r()) * 6.2832, d = 12 + num(r()) * 8, x = Math.sin(a) * d, z = Math.cos(a) * d, okk = true;
      for (var i = 0; i < out.length; i++) if (Math.hypot(out[i].x - x, out[i].z - z) < 6) okk = false;
      if (okk) out.push({ x: x, z: z });
    }
    return out;
  };
  K.spinFor = function (deg, dmg) {
    if (typeof deg !== "number" || !isFinite(deg) || typeof dmg !== "number" || isNaN(dmg)) return 0;
    return deg <= 45 && dmg >= K.SPIN_MIN_DMG ? K.SPIN_TIME : 0;
  };
  K.barrelDamage = function (dist) {
    if (typeof dist !== "number" || isNaN(dist)) return 0;
    var d = Math.max(0, dist); if (d >= K.BARREL_R) return 0;
    return K.BARREL_DMG * (1 - d / K.BARREL_R);
  };
  // ---- S-D06: Stromausfall ----
  K.BLACKOUT = { fromWave: 4, earliest: 12, span: 10, dark: 4, surge: 0.7, roll: 0.35, dim: 0.15, ramp: 0.25 };
  // Zeitpunkt in Wellenzeit; -1 = kein Ausfall. rnd wird hineingereicht (R-01)
  K.blackoutAt = function (wave, rnd) {
    var n = Math.floor(num(wave)); if (n < K.BLACKOUT.fromWave) return -1;
    var u = typeof rnd === "function" ? rnd() : NaN; u = typeof u === "number" && isFinite(u) ? Math.min(0.9999, Math.max(0, u)) : 0.5;
    return K.BLACKOUT.earliest + K.BLACKOUT.span * u;
  };
  K.blackoutPhase = function (t, start) {
    if (typeof t !== "number" || typeof start !== "number" || !isFinite(t) || !isFinite(start) || start < 0) return "aus";
    var e = t - start + 1e-9, B = K.BLACKOUT;
    return e < 1e-9 ? "aus" : e < B.dark ? "dunkel" : e < B.dark + B.surge ? "stoss" : "vorbei";
  };
  K.coast = function (v, dt) {
    if (typeof v !== "number" || !isFinite(v)) return 0;
    var d = typeof dt === "number" && isFinite(dt) && dt > 0 ? dt : 0;
