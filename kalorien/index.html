<!doctype html>
<html lang="de">
<head>

<meta name="description" content="Kalorien-Tracker: Mahlzeiten und Sport eintragen, Tagesrichtwert und Woche sehen. Alles bleibt auf deinem Gerät.">

<title>Kalorien-Tracker</title>
<style>
/* Layout: eine Handy-Spalte im normalen Seitenfluss (keine festen Leisten: in der Claude-Ansicht kann der Rahmen so hoch wie die Seite sein,
   dann läge alles Feste außerhalb des Bildschirms). Oben Konto, Tagesteller, Aktionsknöpfe, Tagesliste. */
:root {
  --bg: #F2F5EF; --flaeche: #FFFFFF; --fg: #17211A; --leise: #4A584E; --linie: #CFD9CC;
  --akzent: #2C6636; --auf-akzent: #FFFFFF; --akzent-weich: #DCEADB;
  --sport: #7A4F00; --sport-ring: #D99A1B; --warn: #A8261C; --warn-weich: #FBE3DF;
  --f-anzeige: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-text: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1511; --flaeche: #18211B; --fg: #E6EEE6; --leise: #A7B6AA; --linie: #2C3A2F;
  --akzent: #82C98F; --auf-akzent: #0B1A0F; --akzent-weich: #1E3323;
  --sport: #F1C467; --sport-ring: #E0A526; --warn: #FF8F85; --warn-weich: #3A1A17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1511; --flaeche: #18211B; --fg: #E6EEE6; --leise: #A7B6AA; --linie: #2C3A2F;
  --akzent: #82C98F; --auf-akzent: #0B1A0F; --akzent-weich: #1E3323;
  --sport: #F1C467; --sport-ring: #E0A526; --warn: #FF8F85; --warn-weich: #3A1A17; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-text); }
.rahmen { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px; }
h1, h2, .zahl { font-family: var(--f-anzeige); text-wrap: balance; margin: 0; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 22px; font-weight: 800; }
p { margin: 0; }
.leise { color: var(--leise); }
.klein { font-size: 16px; }
.menge { display: flex; align-items: center; gap: 8px; }
.menge button { width: 44px; height: 44px; flex: none; padding: 0; font-size: 22px; }
.menge .regler { flex: 1; min-width: 0; }
.haken { display: flex; align-items: center; gap: 10px; }
.haken input { width: 24px; height: 24px; flex: none; }
.hinweiskarte { background: var(--akzent-weich); border-radius: var(--r); padding: 12px 16px; }
.hinweiskarte p + p { margin-top: 8px; }
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marke { font-family: var(--f-anzeige); font-weight: 800; font-size: 18px; }
button, select, input { font: inherit; color: inherit; }
/* Dateifeld bleibt im Layout (nicht display:none), damit Handy-Ansichten die Auswahl sicher öffnen */
.unsichtbar { position: fixed; width: 1px; height: 1px; opacity: 0; overflow: hidden; left: 0; top: 0; }
label.knopf { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; border: 1px solid var(--linie);
  background: var(--flaeche); padding: 0 18px; cursor: pointer; font-weight: 600; font-size: 16px; user-select: none; }
label.knopf.haupt { background: var(--akzent); color: var(--auf-akzent); border-color: var(--akzent); }
label.knopf:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
.leiste label.knopf { min-height: 52px; }
button { min-height: 44px; border-radius: 999px; border: 1px solid var(--linie); background: var(--flaeche); padding: 0 18px; cursor: pointer; font-weight: 600; }
button.haupt { background: var(--akzent); color: var(--auf-akzent); border-color: var(--akzent); }
button.warn { background: var(--warn-weich); color: var(--warn); border-color: var(--warn); }
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 8px; max-width: 55%; min-width: 0; }
.chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .chip-text { display: flex; flex-direction: column; min-width: 0; text-align: left; }
.chip .chip-name { display: block; }
.chip .chip-art { display: block; font-size: 14px; color: var(--leise); line-height: 1; }
.punkt { width: 28px; height: 28px; border-radius: 50%; background: var(--akzent-weich); color: var(--akzent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
.gruppe-titel { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
input, select { min-height: 44px; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche); padding: 0 12px; min-width: 0; width: 100%; }
.feld-fehler { color: var(--warn); font-size: 14px; font-weight: 600; }
.formular { display: grid; gap: 14px; }
.zwei { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wahl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.wahl button[aria-pressed="true"] { background: var(--akzent); color: var(--auf-akzent); border-color: var(--akzent); }
/* Tagesteller */
.teller { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 24px; padding: 20px; display: grid; gap: 16px; }
.ring { position: relative; width: min(240px, 70vw); aspect-ratio: 1; max-width: 100%; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .mitte { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.ring .zahl { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.werte { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.werte .zahl { font-size: 20px; font-variant-numeric: tabular-nums; }
.liste { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.eintrag { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto 44px; align-items: center; gap: 10px; background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r); padding: 6px 6px 6px 12px; }
.pin-zeile { list-style: none; }
.eintrag .art { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--akzent-weich); color: var(--akzent); font-weight: 800; }
.eintrag.sport .art { background: var(--warn-weich); color: var(--sport); }
.eintrag .titel { overflow-wrap: anywhere; }
.eintrag .kcal { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.eintrag button { padding: 0; width: 44px; border: 0; background: transparent; font-size: 20px; }
.eintrag .titel-knopf { width: auto; min-height: 44px; text-align: left; font-size: inherit; font-weight: inherit; color: inherit; display: block; }
.eintrag .titel-knopf .akzent { color: var(--akzent); font-weight: 700; }
.leer { border: 1px dashed var(--linie); border-radius: var(--r); padding: 16px; text-align: center; }
/* Aktionsleiste */
.leiste { }
.leiste .innen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } /* S-009: Kamera, Galerie; Essen suchen, Sport */
.leiste button { min-height: 52px; }
/* Blätter */
.blatt { background: var(--bg); }
.blatt .rahmen { padding-block: 12px 32px; }
.foto { width: 100%; max-height: 38vh; object-fit: cover; border-radius: 18px; background: var(--akzent-weich); }
.status { background: var(--akzent-weich); border-radius: var(--r); padding: 12px 14px; }
.status > p + .knopfreihe { margin-top: 12px; }
.status.fehler { background: var(--warn-weich); color: var(--warn); font-weight: 600; }
.position { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r); padding: 10px 6px 10px 14px; display: grid; gap: 4px; }
.position .zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; gap: 8px; align-items: center; }
.position .zeile button { width: 44px; padding: 0; border: 0; background: transparent; font-size: 20px; }
.position input[type=range] { accent-color: var(--akzent); padding: 0; border: 0; background: transparent; }
.sicher { font-size: 16px; color: var(--leise); }
.position .andere { margin-top: 6px; font-weight: 500; } /* S-007 AK-3 */
#ersetzen-hinweis { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
/* S-004: Summe und Speichern bleiben beim Verschieben der Regler im Blick */
.summe { position: sticky; bottom: 8px; z-index: 2; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 18px; padding: 12px 12px 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .12); }
.summe .zahl { font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.summe button { min-height: 52px; padding: 0 28px; }
.treffer { display: flex; flex-wrap: wrap; gap: 8px; }
.treffer button { font-weight: 400; }
.hinweis { max-width: 488px; margin: 8px auto 0; width: calc(100% - 32px); background: var(--fg); color: var(--bg); border-radius: var(--r); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hinweis[hidden] { display: none; }
.eintrag.geloescht { opacity: .85; border-style: dashed; grid-template-columns: 36px minmax(0, 1fr) auto; }
.eintrag .rueckgaengig { width: auto; min-height: 44px; padding: 0 14px; border: 2px solid var(--akzent); border-radius: 999px; font-weight: 700; font-size: 16px; color: var(--akzent); }
.knopfreihe { display: flex; flex-wrap: wrap; gap: 8px; }
.knopfreihe > * { flex: 1 1 140px; }
.konto-zeile { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
/* S-002: Tagwahl, Zielzeile, Woche, Gewicht, Mahlzeitart, Zuletzt, eigene Speise, Sicherung */
.tagwahl { display: flex; align-items: center; gap: 2px; margin-left: -10px; white-space: nowrap; }
.tagwahl .pfeil { width: 44px; padding: 0; border: 0; background: transparent; font-size: 24px; line-height: 1; }
.status.vortag { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.zielzeile { display: grid; gap: 4px; text-align: center; color: var(--leise); }
.zielzeile .grund { color: var(--fg); font-weight: 600; }
.woche { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 24px; padding: 16px; display: grid; gap: 10px; }
.woche-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.saeulen { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.saeule { min-height: 0; height: 132px; padding: 4px 0 0; border: 0; border-radius: 10px; background: transparent; display: grid; grid-template-rows: 1fr 22px; font-weight: 600; }
.saeule .flaeche { margin-top: 20px; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.saeule .balken { width: 62%; max-width: 26px; min-height: 2px; background: var(--akzent); border-radius: 4px 4px 0 0; }
.saeule.ueber .balken { background: var(--warn); }
.saeule .budget-strich { position: absolute; left: 12%; right: 12%; height: 2px; background: var(--fg); opacity: .55; border-radius: 1px; }
.saeule .leer-strich { width: 40%; height: 2px; background: var(--linie); }
.saeule .ueber-text { position: absolute; top: -20px; left: 0; right: 0; font-size: 14px; color: var(--warn); font-weight: 700; }
.saeule .tag-name { font-size: 14px; color: var(--leise); align-self: center; }
.saeule.gewaehlt { background: var(--akzent-weich); }
.akzent { color: var(--akzent); }
@media (max-width: 440px) { .woche { padding: 16px 0; } .woche-kopf { padding: 0 12px; } .saeulen { gap: 0; } } /* 44 px je Balken auch bei 360 px */
.saeule.gewaehlt .tag-name { color: var(--fg); font-weight: 800; }
details { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r); padding: 4px 14px; }
details[open] { padding-bottom: 14px; }
details > summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; cursor: pointer; }
/* Prüfrunde 6 (6-E4): aufklappbar erkennbar, nicht wie ein leeres Feld */
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary:not(:has(> span))::after { content: 'aufklappen ▾'; font-weight: 400; color: var(--akzent); }
details > summary { flex-wrap: wrap; }
details[open] > summary:not(:has(> span))::after { content: 'zuklappen ▴'; }
details .formular { grid-template-columns: minmax(0, 1fr) auto; align-items: end; margin-bottom: 10px; }
details .eintrag { grid-template-columns: minmax(0, 1fr) auto 64px; padding: 6px 12px; }
.veraenderung { text-align: right; font-variant-numeric: tabular-nums; }
.wahl.vier { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.wahl.vier button { padding: 0 4px; font-size: 14px; }
.volle-breite { flex: 1 1 100%; }
.treffer .eigene { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--r); padding: 14px; }
.treffer .eigene .zwei { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fussnote { text-align: center; margin-top: 8px; }
label.link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; color: var(--akzent); text-decoration: underline; cursor: pointer; font-size: inherit; }
textarea { font: 14px/1.4 ui-monospace, monospace; width: 100%; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--fg); padding: 8px; }
.tipps { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 24px; padding: 16px; display: grid; gap: 12px; }
.tipps-liste { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
.tipps-liste strong { font-family: var(--f-anzeige); }
.tipps-liste p { margin-top: 2px; }
@media (prefers-reduced-motion: no-preference) { .ring circle { transition: stroke-dasharray .5s ease; } }
.warnband { max-width: 488px; margin: 8px auto 0; width: calc(100% - 32px); background: var(--warn-weich); color: var(--warn); border: 2px solid var(--warn); font-weight: 600; border-radius: var(--r); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.warnband[hidden] { display: none; }
.warnband button { flex: none; }
/* Breite Fenster (z. B. claude.ai in der Desktop-Ansicht am Handy, ~920 px): App wächst mit statt schmaler Spalte (Prüfrunde 3). */
/* 5-E6: sehr schmal (200 % Zoom): Kopf und Leiste brechen um statt quer zu scrollen */
@media (max-width: 300px) {
  .kopf { flex-wrap: wrap; } .chip { max-width: 100%; }
  .leiste .innen { grid-template-columns: 1fr; }
  .werte { grid-template-columns: 1fr !important; }
  .eintrag { grid-template-columns: minmax(0, 1fr) auto 44px; gap: 6px; } .eintrag .art { display: none; }
  .eintrag.geloescht { grid-template-columns: minmax(0, 1fr) auto; }
}
/* S-010: AR-Überlagerung über dem Kamerabild; Streifen deckend (Kontrast auch über hellem Bild mindestens 7:1) */
#ar-overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; background: transparent; }
#ar-overlay[hidden] { display: none; }
#ar-ziel { position: absolute; left: 50%; top: 45%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border: 4px solid #ffffff; border-radius: 50%; box-shadow: 0 0 0 2px #000000; }
#ar-ziel.gefunden { border-color: #5fcf8a; }
.ar-streifen { background: rgba(0, 0, 0, 0.85); color: #ffffff; padding: 16px max(16px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.ar-streifen p { margin: 0; font-size: 17px; line-height: 1.4; }
.ar-knoepfe { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ar-knoepfe button { min-height: 48px; padding: 0 8px; background: #ffffff; color: #111111; border-color: #ffffff; }
.ar-knoepfe button.haupt { background: #1f7a45; color: #ffffff; border-color: #1f7a45; }
.ar-knoepfe button:disabled { opacity: 0.55; }
@media (min-width: 700px) { .rahmen, .hinweis, .warnband { zoom: 1.25; } }
@media (min-width: 860px) { .rahmen, .hinweis, .warnband { zoom: 1.5; } }
@media (min-width: 1100px) { .rahmen, .hinweis, .warnband { zoom: 1.6; } }
.ng-leiste{max-width:520px;margin:0 auto;padding:max(8px,env(safe-area-inset-top,0px)) 16px 0;display:grid;gap:6px}
a.ng-zurueck{justify-self:start;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:var(--flaeche);border:1px solid var(--linie);color:var(--fg);font-weight:700;text-decoration:none}
#ng-hinweis{margin:0;font-size:14px;color:var(--leise)}
</style>
</head>
<body>
<div class="ng-leiste"><a class="ng-zurueck" href="../">← Spiele</a><p id="ng-hinweis">Foto-Erkennung und Tipps gehen nur in der Claude-App. Hier trägst du Essen über die Suche ein. Alles bleibt auf deinem Gerät.</p></div>
<div class="hinweis" id="hinweis" role="status" hidden></div>
<div class="warnband" id="ungespeichert" role="alert" hidden><span>Nicht gespeichert: Der Speicher des Browsers ist voll oder gesperrt. Änderungen gehen beim Schließen verloren.</span><button id="ungespeichert-sichern" type="button">Daten sichern</button></div>
<div id="app"></div>
<div id="ar-overlay" hidden></div>
<input type="file" id="datei" accept="image/*" class="unsichtbar" tabindex="-1" aria-hidden="true">
<input type="file" id="kamera" accept="image/*" capture="environment" class="unsichtbar" tabindex="-1" aria-hidden="true">
<input type="file" id="sicherung-datei" accept=".json,application/json" class="unsichtbar" tabindex="-1" aria-hidden="true">
<script>
(() => {
const __M = {};
__M['entity/naehrwerte.js'] = (() => {
// Entity: reine Rechenregeln (R-04). Keine Zeit, kein Zufall, keine Plattform (R-02).

const AKTIVITAET = [
  // PAL-Stufen der DGE, Alltag ohne Training (S-004 AK-1): Training wird als Sport eingetragen und zählt dann netto.
  { id: 'sitzend', faktor: 1.2, text: 'Sehr eingeschränkt: fast nur sitzend oder liegend' }, // S-005 AK-3
  { id: 'leicht', faktor: 1.4, text: 'Überwiegend sitzend (zum Beispiel Büro)' },
  { id: 'maessig', faktor: 1.6, text: 'Sitzend, dazu viel gehend oder stehend' },
  { id: 'aktiv', faktor: 1.8, text: 'Überwiegend gehend oder stehend (zum Beispiel Verkauf, Pflege)' },
  { id: 'sehr', faktor: 2.0, text: 'Körperlich schwere Arbeit (zum Beispiel Bau)' },
];
const GESCHLECHT = { mann: 5, frau: -161, divers: -78 };
const GRENZEN = { alter: [14, 100], groesse: [120, 230], gewicht: [30, 300] };
const SICHERHEIT = { hoch: 0.2, mittel: 0.25, niedrig: 0.4 }; // hoch ±20 %: auch ein sicheres Modell hat nichts gewogen (S-004 AK-11)
const MINUTEN = [1, 600];

// Unter 18 Jahren Schofield (WHO 1985, 10 bis 18 Jahre, S-005 AK-4), mit 17 der Mittelwert mit Mifflin (S-006 AK-2), 18 bis 59 Mifflin-St Jeor,
// ab 60 FAO/WHO 2001 (Schofield über 60, S-006 AK-1: Mifflin unterschätzt im Alter bis 22 %); divers je der Mittelwert.
const SCHOFIELD = { mann: [17.686, 658.2], frau: [13.384, 692.6] };
const FAO_60 = { mann: [11.711, 587.7], frau: [9.082, 658.5] };
const AELTERE_AB = 60;
const nachGeschlecht = (p, f) => (p.geschlecht === 'divers' ? (f('mann') + f('frau')) / 2 : f(p.geschlecht));
const mifflin = p => 10 * p.gewicht + 6.25 * p.groesse - 5 * p.alter + GESCHLECHT[p.geschlecht];
const linear = (tabelle, p) => nachGeschlecht(p, g => tabelle[g][0] * p.gewicht + tabelle[g][1]);
function grundumsatzRoh(p) {
  if (p.alter < 17) return linear(SCHOFIELD, p);
  if (p.alter < 18) return (linear(SCHOFIELD, p) + mifflin(p)) / 2;
  return p.alter >= AELTERE_AB ? linear(FAO_60, p) : mifflin(p);
}
const grundumsatz = p => Math.round(grundumsatzRoh(p));
// Mehrbedarf in Schwangerschaft und Stillzeit nach DGE (S-005 AK-1); altes true gilt als 'frueh'.
const MEHRBEDARF = { frueh: 0, mitte: 250, spaet: 500, stillt: 500, teilweise: 250 }; // teilweise stillen (S-006 AK-3)
const schwangerStufe = v => (v === true ? 'frueh' : (typeof v === 'string' && Object.hasOwn(MEHRBEDARF, v) ? v : undefined));
function bedarf(p) {
  const a = AKTIVITAET.find(x => x.id === p.aktivitaet);

function profilPruefen(e) {

// Bereich vor dem Runden prüfen (Prüfrunde 2: 600,4 min galt sonst als 600).

function mahlzeitSumme(positionen) {

// Zielgröße für das Foto vor dem Senden: längste Kante höchstens maxKante, nie vergrößern, Seitenverhältnis bleibt.

  return { breite: Math.max(1, Math.round(breite * f)), hoehe: Math.max(1, Math.round(hoehe * f)) };

// S-002: Ziele mit sicheren Grenzen (A-9).
const ZIELE = [

// Abnehmen endet am höchsten Boden (Untergrenze, Grundumsatz, 75 % des Bedarfs), aber nie über dem Bedarf (S-004 AK-3).

      feld('alter', 'Alter (14 bis 100)', { inputmode: 'numeric' }, w.alter ?? k?.alter),
      feld('groesse', 'Größe cm', { inputmode: 'numeric' }, w.groesse ?? k?.groesse),
      feld('gewicht', 'Gewicht kg', { inputmode: 'decimal' }, w.gewicht ?? (k ? String(k.gewicht).replace('.', ',') : ''))),
    h('label', { for: 'aktivitaet' }, 'Wie aktiv bist du im Alltag, ohne Training?',
      h('select', { id: 'aktivitaet', name: 'aktivitaet' }, D.AKTIVITAET.map(a =>
        h('option', { value: a.id, selected: (w.aktivitaet ?? k?.aktivitaet ?? 'leicht') === a.id }, a.text)))),
    // S-006 AK-12: nur bei Frau oder divers; Text ohne Fachwörter
    h('div', { id: 'schwanger-bereich', klasse: 'gruppe', hidden: !mitStufe() },
      h('label', { for: 'schwanger' }, 'Schwangerschaft oder Stillzeit',
        h('select', { id: 'schwanger', name: 'schwanger' }, SCHWANGER_WAHL.map(([id, text]) =>

      h('p', { klasse: 'klein leise', id: 'schwanger-hinweis' }, 'Wenn du schwanger bist oder stillst, braucht dein Körper mehr Energie. Die App rechnet das mit ein. Fragen zur Ernährung beantworten Hebamme oder Ärztin.')),
    h('label', { for: 'ziel' }, 'Dein Ziel', zielAuswahl(w.alter ? w : k)),
    h('p', { klasse: 'klein grund', id: 'ziel-hinweis', 'aria-live': 'polite' }, zielHinweis(w.alter ? w : k)),
    h('p', { klasse: 'klein leise', id: 'krankheit-hinweis' }, 'Hast du eine Krankheit wie Diabetes, ein Herz- oder Nierenleiden oder eine Essstörung? Dann sprich dein Ziel mit deiner Hausarztpraxis ab.'), // S-006 AK-8
    !k && feld('pin', 'PIN (freiwillig, 4 Ziffern)', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 4, autocomplete: 'off', oninput: nurZiffern }),
    h('button', { klasse: 'haupt', type: 'submit', id: 'konto-speichern' }, k ? 'Profil speichern' : 'Konto anlegen'));
}

const SCHWANGER_WAHL = [['', 'Nein'], ['frueh', 'Schwanger bis zum 3. Monat'], ['mitte', 'Schwanger im 4. bis 6. Monat (+250 kcal)'],
  ['spaet', 'Schwanger ab dem 7. Monat (+500 kcal)'], ['stillt', 'Ich stille voll (+500 kcal)'], ['teilweise', 'Ich stille teilweise (+250 kcal)']]; // S-006 AK-3
const sportText = n => `etwa ${kcal(n)} verbraucht, dein Richtwert steigt um ${kcal(D.sportAngerechnet(n))}`; // S-006 AK-4
const mitStufe = () => ui.geschlecht === 'frau' || ui.geschlecht === 'divers';
const GRUND_KURZ = { minderjaehrig: 'unter 18 nicht möglich', untergewicht: 'bei Untergewicht nicht möglich', schwanger: 'in Schwangerschaft und Stillzeit nicht möglich',
  senior: 'ab 65 erst ab BMI 30', uebergewicht: 'bei Übergewicht nicht möglich', normalgewicht: 'bei deinem Gewicht nicht nötig' }; // S-006 AK-6
// Gründe je Ziel aus den Angaben im Formular; leer, solange Angaben fehlen (S-005 AK-9).
function zielGruende(e) {
  if (!e) return {};
  const p = D.profilPruefen({ ...e, name: 'x', geschlecht: e.geschlecht ?? ui.geschlecht ?? 'divers', aktivitaet: e.aktivitaet ?? 'leicht' });
  if (!p.ok) return {};
  return Object.fromEntries(D.ZIELE.map(z => [z.id, D.zielErlaubt(p.profil, z.id).grund]).filter(x => x[1]));
}
// Nicht erlaubte Ziele sind nicht wählbar und nennen den Grund (S-005 AK-9); die Rechnung schützt zusätzlich (S-004 AK-4).
function zielAuswahl(e) {
  const g = zielGruende(e), wahl = g[ui.zielWunsch.ziel] ? 'halten' : ui.zielWunsch.ziel;
  return h('select', { id: 'ziel', name: 'ziel', 'data-gruende': JSON.stringify(g) }, D.ZIELE.map(z => h('option', { value: z.id, selected: wahl === z.id, disabled: !!g[z.id] },
    g[z.id] ? `${z.text} (${GRUND_KURZ[g[z.id]]})` : z.text)));
}
// Hinweis zu den Zielen schon vor dem Speichern (S-004 AK-5): nennt die Gründe der nicht wählbaren Ziele, sonst leer.
function zielHinweis(e) {
  return [...new Set(Object.values(zielGruende(e)))].map(x => GRUND_TEXT[x]).join(' ');
}
function zielHinweisNeu(ev) {
  if (ev.type === 'input' && ev.target?.name && ui.fehler[ev.target.name]) { // Prüfrunde 6 (6-E1): alte Meldung weg, sobald im Feld getippt wird
    delete ui.fehler[ev.target.name]; ev.target.closest('label')?.querySelector('.feld-fehler')?.remove(); ev.target.removeAttribute('aria-invalid');
  }
  const fd = new FormData(ev.currentTarget), ziel = document.getElementById('ziel-hinweis'), wahl = document.getElementById('ziel');
  const e = { alter: fd.get('alter'), groesse: fd.get('groesse'), gewicht: fd.get('gewicht'), aktivitaet: fd.get('aktivitaet'), schwanger: fd.get('schwanger') };
  if (wahl && ev.target === wahl) ui.zielWunsch.ziel = wahl.value;
  else if (wahl && wahl.dataset.gruende !== JSON.stringify(zielGruende(e))) wahl.replaceWith(zielAuswahl(e)); // nur wenn sich Gründe ändern
  if (ziel) ziel.replaceChildren(zielHinweis(e));
}

function kontoAbschicken(ev) {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const eingabe = { name: fd.get('name'), geschlecht: ui.geschlecht, alter: fd.get('alter'), groesse: fd.get('groesse'),
    gewicht: fd.get('gewicht'), aktivitaet: fd.get('aktivitaet'), ziel: fd.get('ziel') ?? 'halten', schwanger: mitStufe() ? fd.get('schwanger') ?? '' : '' }; // '' = Nein, bleibt nach einem Fehler gewählt; bei Mann nie (S-006 AK-12)
  // Anlegen und Profiländerung schreiben das Gewicht als Wert für heute in den Verlauf (S-002 AK-8).
  const r = ui.kontoModus === 'bearbeiten' ? tracker.kontoAendern(eingabe, jetzt(), versatz())
    : tracker.kontoAnlegen(eingabe, neueId(), fd.get('pin') || undefined, jetzt(), versatz());
  ui.fehler = r.ok ? {} : r.fehler; ui.eingabe = r.ok ? null : eingabe;
  if (r.ok) {
    tracker.zielSetzen(eingabe.ziel);
    ui.zielWunsch = null; ui.blatt = null; ui.geschlechtGesetzt = false; ui.datum = null; sichern();
    melden(`Richtwert: ${kcal(tracker.tag(jetzt(), versatz()).ziel.kcal)}`);
  }
  zeichnen();
}

          document.getElementById('sportvorschau')?.removeAttribute('hidden'); document.getElementById('sportvorschau')?.replaceChildren(n === null ? 'Minuten von 1 bis 600' : sportText(n)); } }),

      h('p', { klasse: 'klein leise' }, 'Trage hier Training und Sport ein, der zusätzlich zu deinem Alltag war. Die Hälfte davon erhöht deinen Richtwert, denn der Verbrauch beim Sport wird leicht überschätzt. Du musst Sport nicht ausgleichen. Viel Bewegung braucht auch genug Essen und Pausen.'),
      h('button', { klasse: 'haupt', type: 'submit', id: 'sport-speichern' }, 'Eintragen')));
}

function konten() {
  const aktiv = tracker.aktivesKonto();
  const zeilen = tracker.konten().flatMap(k => [h('li', { klasse: 'eintrag' },

  const eigene = tracker.eigeneSpeisen();
  return h('main', { klasse: 'rahmen' },
    h('div', { klasse: 'kopf' }, h('h2', {}, 'Konten'), aktiv && h('button', { onclick: schliessen }, 'Zurück')),

      aktiv && h('button', { id: 'profil-bearbeiten', onclick: () => { ui.kontoModus = 'bearbeiten'; ui.fehler = {}; ui.eingabe = null; ui.zielWunsch = null; ui.geschlechtGesetzt = false; oeffnen('kontoform'); } }, 'Profil bearbeiten')),
    aktiv && !ui.pinZiel && (ui.loeschenFragen
      ? h('div', { klasse: 'status fehler' }, h('p', {}, `${aktiv.name} mit allen Einträgen löschen? Das lässt sich nicht rückgängig machen. Auch alte Kopien, die die App beim Laden einer Sicherung aufhebt, werden gelöscht.`),
          h('div', { klasse: 'knopfreihe' }, h('button', { klasse: 'warn', id: 'loeschen-ja', onclick: () => { ui.loeschenFragen = false; ui.fokusKopf = true; ui.geschlecht = null; ui.geschlechtGesetzt = false; ui.eingabe = null; aendern(() => tracker.kontoLoeschen()); D.rueckwegeEntfernen(browserSpeicher); if (tracker.aktivesKonto()) schliessen(); } }, 'Ja, löschen'),
            h('button', { id: 'loeschen-nein', onclick: () => { ui.loeschenFragen = false; zeichnen(); } }, 'Nein')))
      : h('button', { klasse: 'warn', id: 'konto-loeschen', onclick: () => { ui.loeschenFragen = true; ui.fokusZiel = '#loeschen-nein'; zeichnen(); } }, `Konto ${aktiv.name} löschen`)),

      h('ul', { klasse: 'liste' }, eigene.map(e => h('li', { klasse: 'eintrag' },
        h('div', { klasse: 'titel' }, e.name, h('div', { klasse: 'klein leise' }, `${e.kcal100} kcal je 100 g · Portion ${e.portion} g`)),

    h('p', { klasse: 'klein leise' }, 'Die Datei ist nicht geschützt, auch nicht durch die PIN. Gib sie nur Menschen, denen du vertraust.'),

        onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); sicherungDatei.click(); } } }, 'Daten laden')),

    h('details', { id: 'text-laden-bereich', open: !!ui.textLadenFehler }, h('summary', {}, 'Daten aus Text laden'),
      h('form', { klasse: 'formular', onsubmit: ev => { ev.preventDefault(); const t = new FormData(ev.target).get('text') ?? ''; ui.textLadenEntwurf = t; sicherungPruefen(t, true); } },
        h('label', { for: 'text-laden' }, 'Füge hier den kopierten Sicherungstext ein:',

// S-004: PIN direkt unter dem angetippten Konto, nur Ziffern, mit Abbrechen und ehrlichem Hinweis
function nurZiffern(ev) { const v = ev.target.value.replace(/\D/g, '').slice(0, 4); if (v !== ev.target.value) ev.target.value = v; }
function pinFormular(k) {
  return h('form', { klasse: 'formular', id: 'pinform', onsubmit: ev => { ev.preventDefault(); kontoOeffnen(k.id, new FormData(ev.target).get('pin')); } },
    h('label', { for: 'pin-eingabe' }, `PIN für ${k.name} (4 Ziffern)`,
      h('input', { id: 'pin-eingabe', name: 'pin', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 4, autocomplete: 'off', type: 'password', oninput: nurZiffern })),

    h('p', { klasse: 'klein leise', id: 'pin-vergessen' }, 'PIN vergessen? Die App kann sie nicht zurücksetzen und niemand kann sie dir schicken. Frag die Person, der das Konto gehört.'));
}

function kontoOeffnen(id, pin) {
  if (pin === null && tracker.konten().find(k => k.id === id)?.mitPin) { ui.pinZiel = id; ui.pinMeldung = ''; zeichnen(); return; }
  if (pin !== null && !/^\d{4}$/.test(pin)) { ui.pinZiel = id; ui.pinMeldung = 'Bitte genau 4 Ziffern eingeben.'; zeichnen(); return; } // kein Fehlversuch (Zweitprüfung S-004)
  const r = tracker.kontoWaehlen(id, pin, jetzt());
  if (r.ok) { ui.pinZiel = null; ui.pinMeldung = ''; ui.datum = null; sichern(); schliessen(); return; }
  ui.pinZiel = id;
  ui.pinMeldung = r.grund === 'gesperrt' ? `Zu viele falsche Versuche. Du kannst es in ${r.sekunden} Sekunden wieder versuchen.`
    : pin === null ? '' : 'Diese PIN passt nicht. Versuch es noch einmal.';
  if (r.grund === 'gesperrt') { // Öffnen bis zum Ende der Sperre aus, danach wieder frei (Prüfrunde 1)
    ui.pinGesperrt = true; clearTimeout(ui.pinUhr);
    ui.pinUhr = setTimeout(() => { ui.pinGesperrt = false; if (ui.pinZiel === id) { ui.pinMeldung = 'Du kannst es wieder versuchen.'; zeichnen(); } }, r.sekunden * 1000);
  }
  sichern(); zeichnen();
}

// ---------- Sicherung (A-14) ----------
async function datenSichern() {
  const text = D.sicherungText(tracker, jetzt()), name = D.sicherungDateiName(jetzt(), versatz());
  ui.sicherungText = null;
  if (claude.downloads) {
    try { await claude.downloads.save({ filename: name, data: text }); melden(`Sicherung gespeichert im Ordner Downloads: ${name}`); return; }
    catch (e) { if (e?.code === 'declined') { melden('Nicht gesichert. Es wurde nichts geändert.'); return; } }
  } else if (!window.claude) {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); melden(`Sicherung gespeichert im Ordner Downloads: ${name}`); return;
  }
  ui.sicherungText = text; zeichnen();
}
async function textKopieren() {
  const feld = document.getElementById('sicherung-text');
  try { await navigator.clipboard.writeText(ui.sicherungText); melden('Text kopiert. Füge ihn in eine Notiz ein.'); return; } catch { /* Zwischenablage gesperrt */ }
  feld?.focus(); feld?.select();
  melden('Kopieren ging nicht automatisch. Der Text ist markiert: halte den Finger darauf und wähle Kopieren.');
}
function sicherungPruefen(text, ausText = false) {
  const r = text === null ? { ok: false, hinweis: 'Die Datei ist zu groß für eine Sicherung. Es wurde nichts geändert.' }
    : new Blob([text]).size > D.SICHERUNG_MAX_BYTES ? { ok: false, hinweis: 'Der Text ist zu groß für eine Sicherung. Es wurde nichts geändert.' }
      : D.sicherungLesen(text);
  ui.textLadenFehler = ausText && !r.ok ? r.hinweis.replace(/Diese Datei/g, 'Dieser Text').replace(/Die Datei/g, 'Der Text') : null;
  if (!r.ok) { ui.ladenFrage = null; zeichnen(); if (!ausText) melden(r.hinweis); return; }
  ui.textLadenEntwurf = null;
  ui.ladenFrage = { daten: r.daten, hinweis: r.hinweis, datei: D.datenUmfang(r.daten), jetzt: D.datenUmfang(tracker.daten()) };
  zeichnen();
  document.getElementById('laden-frage')?.scrollIntoView({ block: 'center' });
}

sicherungDatei.addEventListener('change', async () => {
  const f = sicherungDatei.files?.[0];
  sicherungDatei.value = '';
  if (!f) return;
  let text = '';
  try { text = f.size > D.SICHERUNG_MAX_BYTES ? null : await f.text(); } catch { text = ''; }
  sicherungPruefen(text);
});

const umfang = u => `${u.konten} ${u.konten === 1 ? 'Konto' : 'Konten'} und ${u.eintraege} ${u.eintraege === 1 ? 'Eintrag' : 'Einträge'}`;
// Was beim Laden nicht mehr hineinpasste (höchstens 20 Konten und 20.000 Einträge), wird genannt statt still verworfen.
const wegText = w => (w && (w.kontenWeg || w.eintraegeWeg) ? ` Nicht geladen, weil kein Platz mehr war: ${umfang({ konten: w.kontenWeg, eintraege: w.eintraegeWeg })}.` : '');
function ladenFrage() {
  const f = ui.ladenFrage;
  const leer = f.jetzt.konten === 0; // S-006 AK-10: auf leerem Handy geht nichts verloren, daher keine Warnfarbe
  return h('div', { klasse: leer ? 'status' : 'status fehler', id: 'laden-frage', role: leer ? 'status' : 'alert' },
    h('p', {}, leer ? `In der Datei stehen ${umfang(f.datei)}. Jetzt laden?`
      : `In der Datei stehen ${umfang(f.datei)}, auf diesem Handy ${umfang(f.jetzt)}. Laden ersetzt alles, was jetzt auf diesem Handy ist. Konten mit PIN bleiben erhalten.`),
    h('div', { klasse: 'knopfreihe' },
      h('button', { klasse: leer ? 'haupt' : 'warn', id: 'laden-ja', onclick: () => {
        const frage = ui.ladenFrage;
        if (!frage) return; // Doppeltipp
        ui.ladenFrage = null;
        const r = D.sicherungLaden(browserSpeicher, tracker, frage.daten, jetzt());
        ui.datum = null; ui.blatt = null; ui.bild = null; ui.titel = ''; ui.pinZiel = null; ui.sicherungText = null; ui.fokusKopf = true;
        zeichnen();
