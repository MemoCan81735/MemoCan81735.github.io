<script>
globalThis.Ebru = {};
(function(){
// Entity: Becken, Farbwelten, Linienzüge (Polygone). Reine Daten und Rechnung, kein Plattformzugriff (R-02, R-04).
(function (g) {
  const BREITE = 400;                 // Einheiten; 1 Einheit = 1 CSS-Pixel bei 400 Pixel Anzeigebreite

    A: { name: 'Klassisch', wasser: '#f4ecd8', papier: '#faf5e6', farben: ['#1b2a6b', '#c0272d', '#e3b23c', '#1aa6a6'] },
    B: { name: 'Erde', wasser: '#f3ead6', papier: '#f8f1e0', farben: ['#a8421f', '#6b7a3a', '#efe2c4', '#16264a'] },
    C: { name: 'Pastell', wasser: '#fff6e6', papier: '#fffaf0', farben: ['#e8869f', '#c4ecd8', '#8a74d0', '#8cc4f4'] },
  };

  function neuesBecken(hoehe) { return { breite: BREITE, hoehe, polys: [], welt: STANDARD_WELT, verlauf: [] }; }

  function kreis(cx, cy, r, farbe) {
    const n = Math.max(48, Math.ceil(2 * Math.PI * r / 4)), p = new Float64Array(n * 2);
    for (let i = 0; i < n; i++) { const a = 2 * Math.PI * i / n; p[2 * i] = cx + r * Math.cos(a); p[2 * i + 1] = cy + r * Math.sin(a); }

  function flaeche(poly) {

    return Math.abs(s) / 2;
  }
  function knoten(b) { let n = 0; for (const q of b.polys) n += q.p.length / 2; return n; }
  function kopiePolys(polys) { return polys.map(q => ({ farbe: q.farbe, p: q.p.slice() })); }
  function kopie(b) { return { breite: b.breite, hoehe: b.hoehe, polys: kopiePolys(b.polys), welt: b.welt, verlauf: [] }; }
  // Prüfsumme: FNV-1a über Farbe, Länge und alle Koordinaten auf 1/1000 gerundet, in Reihenfolge der Linienzüge. Die Farbwelt zählt nicht (nur Form).
  function pruefsumme(b) {

    const mix = v => { h ^= v & 0xff; h = Math.imul(h, 0x01000193); h ^= (v >>> 8) & 0xff; h = Math.imul(h, 0x01000193); h ^= (v >>> 16) & 0xff; h = Math.imul(h, 0x01000193); h ^= (v >>> 24) & 0xff; h = Math.imul(h, 0x01000193); };

  }
  function leuchtdichte(hex) { const v = parseInt(hex.slice(1), 16); return (0.2126 * ((v >> 16) & 255) + 0.7152 * ((v >> 8) & 255) + 0.0722 * (v & 255)) / 255; }

  function papierRauschen(rnd, w, h) { const a = new Uint8Array(w * h); for (let i = 0; i < a.length; i++) a[i] = 128 + Math.round((rnd() - 0.5) * 20); return a; }

  g.Ebru.entity = { BREITE, PIXELDICHTE_S24, STANDARD_WELT, PALETTEN, neuesBecken, kreis, flaeche, knoten, kopie, kopiePolys, pruefsumme, leuchtdichte, streuung, papierRauschen };
})(globalThis);

})();

(function(){
// Control: Strömung der Kitre um bewegte Zinken (S-002). Reine Funktionen, keine Zeit, kein Zufall (R-02, R-04).
// Stromfunktion psi = L * Phi(n) * G(s) * W(x, y); Geschwindigkeit u = (dpsi/dn) * m - (dpsi/ds) * nvec ist exakt divergenzfrei (Fläche bleibt).
//   n: Abstand quer zur Zugrichtung, s: längs (0 = Zinke, negativ = dahinter)
//   f(n) = Phi'(n) = c [exp(-(n/a)^2) - k exp(-(n/b)^2)], k = a/b, c = 1/(1-k): f(0) = 1 (Farbe an der Zinke wandert mit), Integral 0 (Rückstrom seitlich)

  const SQP = Math.sqrt(Math.PI), RANDZONE = 10;

  for (let i = 0; i < ERF.length; i++) { ERF[i] = erfGenau(i / TS); GAU[i] = Math.exp(-((i / TS) ** 2)); }
  function tafel(T, ax) { if (ax >= 6) return T[6 * TS]; const u = ax * TS, i = u | 0; return T[i] + (T[i + 1] - T[i]) * (u - i); }

  function art(a, rueck, nachlauf, schritt) {
    const b = rueck * a, k = a / b, c = 1 / (1 - k), grenze = 3 * b, m = Math.ceil(grenze * 50) + 2, F = new Float64Array(m), P = new Float64Array(m);

  }

  // Geschwindigkeit am Punkt (px, py) für alle Zinken eines Teilschritts. Alle Zinken eines Schritts haben dieselbe Richtung (m) und dasselbe L, D;
  // z = { mx, my, L, D, cx0, cy0 (Zugmitte), versatz: [..], cx/cy: Zinkenorte }. Längsanteil G(s) wird je Punkt einmal gerechnet.
  function geschwindigkeit(px, py, z, p, breite, hoehe) {
    const [x1, dx1] = rampe(px), [x2, dx2] = rampe(breite - px), [y1, dy1] = rampe(py), [y2, dy2] = rampe(hoehe - py);
    const W = x1 * x2 * y1 * y2; if (W === 0) return null;

    const s = (px - z.cx0) * z.mx + (py - z.cy0) * z.my; // gleich für alle Zinken
    if (s > 3 * p.sig || s < -z.D - 3 * p.sig) return null;
    const g1 = 0.5 * (1 + erf(-s / p.sig)), g2 = 0.5 * (1 + erf((s + z.D) / p.sig)), G = g1 * g2;
    const Gs = (-gau(s / p.sig) * g2 + g1 * gau((s + z.D) / p.sig)) / (p.sig * SQP);
    let sf = 0, sPhi = 0, getroffen = false;
    const n0 = -(px - z.cx0) * z.my + (py - z.cy0) * z.mx, grenze = p.grenze; // n je Zinke = n0 - Versatz (parallele Zinken)
    for (const o of z.versatz) {
      const n = n0 - o; if (n > grenze || n < -grenze) continue;
      getroffen = true; const an = n < 0 ? -n : n, u = an * 50, i = u | 0, w = u - i;
      sf += p.F[i] + (p.F[i + 1] - p.F[i]) * w; const ph = p.P[i] + (p.P[i + 1] - p.P[i]) * w; sPhi += n < 0 ? -ph : ph;
    }
    if (!getroffen) return null;
    const dn = z.L * (sf * G * W + sPhi * G * Wn), ds = z.L * (sPhi * Gs * W + sPhi * G * Ws);
    return [dn * z.mx + ds * z.my, dn * z.my - ds * z.mx];
  }
  // Ein Teilschritt (Runge-Kutta 2) für alle Knoten; Knoten außerhalb des Wirkbereichs werden übersprungen.
  function teilschritt(b, z, p) {
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    const rr = Math.max(p.grenze, z.D + 3 * p.sig);
    for (let k = 0; k < z.cx.length; k++) { minx = Math.min(minx, z.cx[k]); maxx = Math.max(maxx, z.cx[k]); miny = Math.min(miny, z.cy[k]); maxy = Math.max(maxy, z.cy[k]); }
    minx -= rr; maxx += rr; miny -= rr; maxy += rr;
    for (const q of b.polys) {
      const pp = q.p;
      for (let i = 0; i < pp.length; i += 2) { // q.bewegt merkt bewegte Linienzüge, nur diese werden danach verfeinert
        const x = pp[i], y = pp[i + 1]; if (x < minx || x > maxx || y < miny || y > maxy) continue;
        const v1 = geschwindigkeit(x, y, z, p, b.breite, b.hoehe); if (!v1 || Math.abs(v1[0]) + Math.abs(v1[1]) < 1e-6) continue;
        const v2 = geschwindigkeit(x + v1[0] / 2, y + v1[1] / 2, z, p, b.breite, b.hoehe) || [0, 0];
        q.bewegt = true; pp[i] = Math.min(b.breite, Math.max(0, x + v2[0])); pp[i + 1] = Math.min(b.hoehe, Math.max(0, y + v2[1]));
      }
    }
  }
  // Zug von (x0,y0) nach (x1,y1) mit Zinken-Versätzen quer zur Richtung; zug.weg = bisher zurückgelegter Weg (Nachlauf).
  function zugSchritt(b, x0, y0, x1, y1, versatze, p, zug, nachher) {
    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 1e-9) return;
    const n = Math.ceil(len / p.schritt), L = len / n, mx = (x1 - x0) / len, my = (y1 - y0) / len;
    for (let k = 1; k <= n; k++) {
      zug.weg += L; const cx = x0 + mx * L * k, cy = y0 + my * L * k, D = Math.min(p.D, zug.weg);
      teilschritt(b, { mx, my, L, D, cx0: cx, cy0: cy, versatz: versatze, cx: versatze.map(o => cx - my * o), cy: versatze.map(o => cy + mx * o) }, p);
      nachher(b);
    }
  }
  g.Ebru.stroemung = { art, geschwindigkeit, zugSchritt, erf, RANDZONE };
})(globalThis);

})();

(function(){
// Control: Marmorieren (Tropfen, Stäbchen, Kamm), Rückgängig, Qualitätsstufe. Reine Funktionen; Zeit und Zufall kommen von außen (R-02).
(function (g) {
  const E = g.Ebru.entity, St = g.Ebru.stroemung;
  const KNOTEN_MAX = 40000, RADIUS_MIN = 18, RADIUS_MAX = 34, UNDO_TIEFE = 10, KANTE_TROPFEN = 6, KANTE_STROM = 3;

    for (let durchgang = 0; durchgang < 4; durchgang++) {

    for (let runde = 0; runde < 6 && E.knoten(b) > KNOTEN_MAX; runde++) {

      const p = q.p;
      for (let i = 0; i < p.length; i += 2) {
