<script>
// Entity: Höhenkarte der Insel, rein, ohne Zeit und Zufall (R-02).
const GROESSE = 24;
const MAX = 8;

// Feste Startkarte: Kegelform aus dem Abstand zur Mitte mit festem Höckermuster (wenig ebenes Land), immer dieselbe.
function startkarte() {
  const k = new Uint8Array(GROESSE * GROESSE);
  const m = (GROESSE - 1) / 2;
  for (let y = 0; y < GROESSE; y++) {
    for (let x = 0; x < GROESSE; x++) {
      const d = Math.hypot(x - m, y - m);
      k[y * GROESSE + x] = Math.max(0, Math.min(MAX, Math.round(5 - d * 0.5 + ((x * 5 + y * 3) % 3) * 0.4)));
    }
  }
  return k;
}

const gueltig = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x >= 0 && y >= 0 && x < GROESSE && y < GROESSE;

function aendere(karte, x, y, schritt) {
  const n = Uint8Array.from(karte);
  if (!gueltig(x, y)) return n;
  const i = y * GROESSE + x;
  n[i] = Math.max(0, Math.min(MAX, n[i] + schritt));
  return n;
}
const heben = (karte, x, y) => aendere(karte, x, y, 1);
const senken = (karte, x, y) => aendere(karte, x, y, -1);

// Entity: Amiga-ähnliche Palette und Kontrastberechnung, rein.
const HOEHENFARBEN = ['#2a5fd6', '#e8d58a', '#4aa83a', '#3c8f30', '#2f7a2a', '#8a8a8a', '#6e6e6e', '#d8d8e8', '#ffffff'];
const TASTE = '#1b2a6b';
const TASTE_TEXT = '#ffe27a';

function luminanz(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function kontrast(a, b) {
  const [l1, l2] = [luminanz(a), luminanz(b)].sort((p, q) => q - p);
  return (l1 + 0.05) / (l2 + 0.05);
}

// Entity: seedbarer Zufallsgenerator (mulberry32), rein. Gleicher Seed, gleiche Folge (R-02: kein Math.random).
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Entity: reine Regeln der Touch-Bedienung (S-005). Keine Plattform, keine Zeit, kein Zufall.

const RING_VERSATZ = 40;     // Pixel über dem Finger
const RING_MIN = 28;         // Mindestdurchmesser des Rings in Pixeln
const ZOOM_MIN = 1;
const ZOOM_MAX = 3;
const ZIEHSCHWELLE = 10;     // Pixel: ab hier gilt der Zug als Ziehen
// Halbe Ausdehnung der Insel-Raute in Bildebene (x rechts, y oben); sin(Elevation) = 1/sqrt(3)
const MITTE_RADIUS = { x: GROESSE / Math.SQRT2, y: GROESSE / Math.SQRT2 / Math.sqrt(3) };

const imFeld = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x >= 0 && y >= 0 && x < GROESSE && y < GROESSE;

// Felder des Pinsels um (x, y), nur innerhalb der Insel; radius 0 = 1 Feld, 1 = 3 mal 3
function bereichFelder(x, y, radius) {
  const r = [];
  for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) if (imFeld(x + dx, y + dy)) r.push({ x: x + dx, y: y + dy });
  return r;
}
// Neue Karte; Felder in `ausser` (Menge von Indizes) bleiben unverändert. Höhen bleiben 0 bis MAX.
function aendereBereich(karte, x, y, radius, schritt, ausser = null) {
  const n = karte.slice();
  for (const f of bereichFelder(x, y, radius)) {
    const i = f.y * GROESSE + f.x;
    if (ausser && ausser.has(i)) continue;
    n[i] = Math.min(MAX, Math.max(0, n[i] + schritt));
  }
  return n;
}
function begrenzeZoom(z) { return Number.isFinite(z) ? Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)) : ZOOM_MIN; }
// Bildmitte bleibt in der Insel-Raute |x|/Rx + |y|/Ry <= 1
function begrenzeMitte(mx, my) {
  if (!Number.isFinite(mx) || !Number.isFinite(my)) return { x: 0, y: 0 };
  const s = Math.abs(mx) / MITTE_RADIUS.x + Math.abs(my) / MITTE_RADIUS.y;
  return s > 1 ? { x: mx / s, y: my / s } : { x: mx, y: my };
}
// Zielfeld des Rings; feldAn (Bildschirm -> Feld) wird hineingereicht
function ringFeld(px, py, feldAn) { return feldAn(px, py - RING_VERSATZ); }
function ringDurchmesser(feldPx, pinsel) { return Math.max(RING_MIN, Math.round(feldPx * pinsel)); }

// Entity: Aufgaben und Hilfekarten des Lernpfads (S-003). Nur Daten und reine Prüfungen.
const ANZAHL = 5;
const HINWEIS_TAKTE = 40;
const TEXT_MAX = 60, HILFE_MAX = 80;
const FENSTER_MIN = 240, FENSTER_MAX = 480;   // Takte, in denen der Testspieler den Lernpfad löst
const imFenster = (takte) => takte >= FENSTER_MIN && takte <= FENSTER_MAX;
const AUFGABEN = [
  'Tippe aufs Land und hebe es: 3 Felder',
  'Mache 4 Felder gleich hoch (2 mal 2)',
  'Warte, bis dein Volk auf 12 wächst',
  'Senke Land unter einem rosa Gegner bis ins Wasser',
  'Besiege das Gegnervolk (Volk 20, Gegner 0)',
];
const HINWEISE = [
  'Tipp: Taste Heben, dann aufs Land tippen.',
  'Tipp: Hebe oder senke, bis 4 Felder gleich hoch sind.',
  'Tipp: Auf ebenem Land bauen Pixelinge Häuser.',
  'Tipp: Taste Senken, dann aufs Land unter dem Gegner tippen.',
  'Tipp: Senke das Land unter allen rosa Figuren.',
];
const HILFE = [
  'Heben: Tippe aufs Land. Der Ring zeigt das Feld.',
  'Haus: Auf ebenem Land bauen Pixelinge Häuser und werden mehr.',
  'Wasser: Land auf Höhe 0 ist Wasser, wer dort steht, ertrinkt.',
  'Sieg: Senke das Land unter dem Gegner, bis keiner mehr da ist.',
];
const textOk = (t) => t.length <= TEXT_MAX;
const hilfeOk = (t) => t.length <= HILFE_MAX;

// Entity: reine Regeln für Ton, Musik, Mana, Flut, Hausanimation (S-004). Keine Plattform, keine Zeit.

const BASIS_HZ = 220;
const MANA_MAX = 10, FLUT_KOSTEN = 8, FLUT_ABKLING = 20, MANA_TAKTE = 10, FLUT_SENKUNG = 2;
// Götterkräfte (S-007): Mana-Kosten höchstens MANA_MAX, damit jede Kraft mit vollem Mana bezahlbar ist; Abklingzeit in Takten
const KRAEFTE = { flut: { kosten: FLUT_KOSTEN, abkling: FLUT_ABKLING }, vulkan: { kosten: 9, abkling: 40 }, sturm: { kosten: 7, abkling: 30 }, erdbeben: { kosten: 10, abkling: 50 } };
const HANDEL_KOSTEN = 3;
const HAUS_ANIM = 6, HAUS_HOEHE = 1.2;
const LAUT = 0.3, PARTIKEL_MAX = 200, TON_LATENZ_MAX = 0.1, TON_JE_BILD = 4;
const STUFE_AB = [0, 0.5, 0.75];    // Anteil der Gegner am Ziel, ab dem Stufe 0, 1, 2 gilt (bei Ziel 40: 20 und 30)
const TEMPO = [120, 120, 140];      // Schläge je Minute je Stufe

// Tonhöhe je Landhöhe: Höhe 0 = 220 Hz, je Stufe ein Halbton
const tonHz = (hoehe) => BASIS_HZ * Math.pow(2, Math.max(0, Math.min(MAX, hoehe)) / 12);
const musikStufe = (gegner, ziel = 40) => (gegner >= STUFE_AB[2] * ziel ? 2 : gegner >= STUFE_AB[1] * ziel ? 1 : 0);
const tempo = (stufe) => TEMPO[stufe] ?? TEMPO[0];
// Hausanimation: von 0 auf 1,2 in genau 6 Takten, danach nicht höher
const hausHoehe = (takte) => HAUS_HOEHE * Math.max(0, Math.min(HAUS_ANIM, takte)) / HAUS_ANIM;
const lautstaerke = (stumm) => (stumm ? 0 : LAUT);

// Jingles: Folge [Frequenz in Hz, Dauer in Sekunden]; beide dauern genau 3 Sekunden
const JINGLE = {
  sieg: [[523.25, 0.4], [659.25, 0.4], [783.99, 0.4], [1046.5, 0.8], [783.99, 0.3], [1046.5, 0.7]],
  niederlage: [[392, 0.5], [349.23, 0.5], [311.13, 0.5], [261.63, 0.5], [233.08, 0.5], [196, 0.5]],
};
const jingleDauer = (art) => JINGLE[art].reduce((s, [, d]) => s + d, 0);

// Musikmuster je Stufe: Basslinie, Melodie (Halbtöne über 220 Hz, null = Pause), Schritte je Takt = 1 Achtel
const BASS = [0, 0, 7, 7, 5, 5, 7, 7];
const MELODIE = [12, null, 15, null, 19, null, 15, 12];
const MELODIE_DICHT = [12, 15, 19, 15, 24, 19, 15, 12];

// Entity: Kampagne (S-006). Kartentabelle, Sterne, Freischaltung, Fortschritt als reine Daten; keine Zeit, kein Zufall, kein Speicherzugriff (R-02).
// Die Zahlen sind Vorschläge zum Abstimmen am Handy (docs/kampagne-entwurf.md). Die Inselgröße bleibt 24 für alle Karten.
const TAKTE_JE_MIN = 120, STERNE_WELT = 6, STERNE_FINALE = 24, FORMAT = 1, ERTRUNKEN_MAX = 5, SCHNELL_ANTEIL = 0.8, BEZUG_MIN = 6, KEIN_LIMIT_MIN = 12;
const K1 = [], K2 = ['flut'], K3 = ['flut', 'vulkan'], K4 = ['flut', 'vulkan', 'sturm'], K5 = ['flut', 'vulkan', 'sturm', 'erdbeben'];
// id, Welt, Name, Start-Pixelinge, Ziel-Bevölkerung, Gegner-Stärke 1 bis 10, Limit in Minuten (0 = keins), Götterkräfte, Boss
const T = [
  ['1-1', 1, 'Palmenstrand', 8, 20, 1, 0, K1, false], ['1-2', 1, 'Sonnenbrillen-Bucht', 6, 30, 2, 0, K1, false], ['1-3', 1, 'Neon-Bande', 6, 40, 3, 6, K1, true],
  ['2-1', 2, 'Kassettenhafen', 6, 40, 3, 0, K2, false], ['2-2', 2, 'Videothek-Riff', 5, 45, 4, 6, K2, false], ['2-3', 2, 'Der Videothekar', 5, 50, 5, 7, K2, true],
  ['3-1', 3, 'Joystick-Strand', 5, 50, 5, 0, K3, false], ['3-2', 3, 'Pixelgeister-Platte', 4, 55, 6, 7, K3, false], ['3-3', 3, 'Joystick-Orden', 4, 60, 7, 8, K3, true],
  ['4-1', 4, 'Tanzflächen-Atoll', 4, 60, 7, 0, K4, false], ['4-2', 4, 'Plattenspieler-Insel', 4, 65, 8, 8, K4, false], ['4-3', 4, 'Synth-Kult', 3, 70, 9, 9, K4, true],
  ['5-1', 5, 'Der Große Mix', 3, 80, 10, 0, K5, true],
];
const GEGNER2 = ['3-2', '3-3'], WASSER = ['4-2', '4-3'], ENDGEGNER = ['5-1'];   // zwei Gegner, wechselnder Wasserstand, Endgegner mit zwei Phasen (S-008)
const HAENDLER = ['2-2', '3-2', '4-2'];   // Kassettenmann: tauscht Mana gegen frische Götterkräfte
const KARTEN = T.map(([id, welt, name, start, ziel, staerke, limitMin, kraefte, boss]) => Object.freeze({ id, welt, name, start, ziel, staerke, limitMin, kraefte, boss, haendler: HAENDLER.includes(id), gegner2: GEGNER2.includes(id), wasser: WASSER.includes(id), endgegner: ENDGEGNER.includes(id) }));
const karte = (id) => KARTEN.find((k) => k.id === id) || null;
const karteZu = karte;   // zweiter Name ohne Umbenennung beim Import (der Bau entfernt Import-Zeilen und kennt keine Aliase)
const limitTakte = (k) => (k.limitMin || KEIN_LIMIT_MIN) * TAKTE_JE_MIN;
// Bezugszeit für den zweiten Stern: Limit der Karte, bei "keins" 6 Minuten
const bezugTakte = (k) => (k.limitMin || BEZUG_MIN) * TAKTE_JE_MIN;

// Sterne: 1 für den Sieg, 2 bei weniger als 80 Prozent der Bezugszeit, 3 zusätzlich mit höchstens 5 ertrunkenen eigenen Pixelingen
function sterneFuer(k, erg) {
  if (!k || !erg || !erg.sieg) return 0;
  if (!(erg.takte < SCHNELL_ANTEIL * bezugTakte(k))) return 1;
  return erg.ertrunken <= ERTRUNKEN_MAX ? 3 : 2;
}

const neuerFortschritt = () => ({ version: FORMAT, sterne: {} });
const st = (f, id) => (f.sterne[id] | 0);
const weltSterne = (f, welt) => KARTEN.reduce((n, k) => n + (k.welt === welt ? st(f, k.id) : 0), 0);
const gesamtSterne = (f) => KARTEN.reduce((n, k) => n + st(f, k.id), 0);
// Freigeschaltet wird gerechnet, nie gespeichert: 1-1 immer; Karte danach nach einem Sieg auf der Vorkarte; neue Welt nach dem Boss und 6 Sternen; Finale mit 24 Sternen und Sieg auf 4-3
function istOffen(f, id) {
  const i = KARTEN.findIndex((k) => k.id === id);
  if (i < 0) return false;
  if (i === 0) return true;
  const k = KARTEN[i], v = KARTEN[i - 1];
  if (k.welt === 5) return gesamtSterne(f) >= STERNE_FINALE && st(f, '4-3') > 0;
  if (k.welt === v.welt) return st(f, v.id) > 0;
  return st(f, v.id) > 0 && weltSterne(f, v.welt) >= STERNE_WELT;
}
// Neuer Fortschritt nach einem Ergebnis; die beste Sternzahl je Karte bleibt, gesperrte Karten zählen nicht
function nachSieg(f, id, erg, deckel = 3) {   // deckel: höchste Sternzahl (leichter Modus 2)

}

function mische(a, b) {

// Entity: Gegnerregeln der Kampagne (S-008): Angriffsabstand, Wasserstand, Boss und Endgegner. Rein, ohne Zeit und Zufall (R-02).
const WASSER_ZYKLUS = 60, WASSER_HOCH_AB = 40;       // Takte: 40 Takte niedrig, 20 Takte Hochwasser (10 Sekunden)

// Angriffsabstand: alle so viele Takte rückt ein Gegner auf den nächsten eigenen Pixeling vor; bis Stärke 3 greifen Gegner nicht an (0)
const angriffsAbstand = (staerke) => (staerke <= 3 ? 0 : 11 - Math.max(1, Math.min(10, staerke)));

// Entity: Tägliche Aufgabe, leichter Modus und Teilen (S-009). Rein: das Datum wird hineingereicht (R-02), der Zufall kommt aus dem Datum.


const LEICHT_ABZUG = 2, LEICHT_STERNE_MAX = 2, JAHR_MIN = 2020, JAHR_MAX = 2099;
const TAGES_KARTEN = KARTEN.filter((k) => k.welt <= 4);   // 12 Karten, nie das Finale
const TAGE = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function datumOk(j, m, t) {
  if (![j, m, t].every(Number.isInteger) || j < JAHR_MIN || j > JAHR_MAX || m < 1 || m > 12 || t < 1) return false;
  const schalt = (j % 4 === 0 && j % 100 !== 0) || j % 400 === 0;
  return t <= TAGE[m - 1] + (m === 2 && schalt ? 1 : 0);

const tagesSeed = (j, m, t) => (datumOk(j, m, t) ? j * 10000 + m * 100 + t : null);

const tageskarte = (seed) => (Number.isInteger(seed) && seed >= 0 ? TAGES_KARTEN[Math.floor(mulberry32(seed)() * TAGES_KARTEN.length)] : null);

// Boundary: Fortschritt speichern (S-006). Die Speicherquelle (Browser-Speicher) wird hineingereicht (R-04); jeder Zugriff ist abgesichert,
// ohne Quelle oder bei Fehlern (privates Fenster, voller Speicher) bleibt der Fortschritt im Arbeitsspeicher.
const SCHLUESSEL = 'neon-ada-fortschritt';

  constructor(quelle = null) {
    this.quelle = quelle; this.speicher = null; this.dauerhaft = false;

  }

    if (this.quelle) { try { const t = this.quelle.getItem(SCHLUESSEL); if (t !== null && t !== undefined) return t; } catch (e) { this.dauerhaft = false; } }

}

// Boundary: isometrische Kamera, reine Rechnung (R-04). Pixelgröße der Optik: 3 Bildschirmpixel.

const PIXEL = 3;
const AUSSCHNITT_NAH = 0.68;   // Looks a, b, c: näher heran als der Grundausschnitt
const ausschnitt = (look) => (look === 'a0' ? 1 : AUSSCHNITT_NAH);
const HOEHE_JE_STUFE = 0.5;
const ELEVATION = Math.atan(1 / Math.SQRT2); // echte Isometrie, ca. 35,26 Grad
const SIN = Math.sin(ELEVATION), COS = Math.cos(ELEVATION);

// Bildposition (x rechts, y oben) einer Feldmitte in Welteinheiten
function projiziere(fx, fy, stufe) {
  const cx = fx + 0.5 - GROESSE / 2, cy = fy + 0.5 - GROESSE / 2;
  return { x: (cx + cy) / Math.SQRT2, y: ((cx - cy) / Math.SQRT2) * SIN + stufe * HOEHE_JE_STUFE * COS };
}

// Halbe Breite und Höhe des Sichtfensters, so dass die ganze Insel mit 6 Prozent Rand hineinpasst
function fenster(breite, hoehe) {
  const a = Math.max(1, breite) / Math.max(1, hoehe);
  const needW = (GROESSE / Math.SQRT2) * 1.06 + 0.3;
  const needH = (GROESSE / Math.SQRT2 * SIN + MAX * HOEHE_JE_STUFE * COS + 1) * 1.06;
  const halbB = Math.max(needW, needH * a);
  return { halbB, halbH: halbB / a };
}

function sichtbar(breite, hoehe) {
  const f = fenster(breite, hoehe);
  let felder = 0, alle = true;
  for (let y = 0; y < GROESSE; y++) for (let x = 0; x < GROESSE; x++) {
    let ok = true;
    for (const s of [0, MAX]) {
      const p = projiziere(x, y, s);
      if (Math.abs(p.x) > f.halbB || Math.abs(p.y) > f.halbH) ok = false;
    }
    if (ok) felder++; else alle = false;
  }
  return { alle, felder, fenster: f };
}

// Figurhöhe: in Welteinheiten und CSS-Pixeln; mindestens 12 Pixel (S-002 AK-9)
function figurHoehe(breite, hoehe) {
  const f = fenster(breite, hoehe);
  const pxJeEinheit = Math.max(1, hoehe) / (2 * f.halbH);
  const welt = Math.max(1.6, 12 / pxJeEinheit);
  return { welt, px: welt * pxJeEinheit };
}

// Breite eines Feldes (Raute) in CSS-Pixeln bei Zoom; basis = Ausschnittsfaktor der Optik (1 oder 0,68)
function feldBreitePx(breite, hoehe, zoom, basis = 1) {
  const f = fenster(breite, hoehe);
  return Math.SQRT2 * zoom * breite / (2 * f.halbB * basis);
}

// Boundary: Partikelrechnung (Staub, Spritzer, Funken). Rein, ohne three.js; die Szene zeichnet die Positionen.

class Partikel {
  constructor(max = PARTIKEL_MAX) { this.max = max; this.p = []; }
  get anzahl() { return this.p.length; }
  // Erzeugt bis zu n Partikel an Weltposition (x, y, z); über dem Limit wird nichts mehr erzeugt. rng wird hineingereicht.
  erzeuge(n, x, y, z, farbe, rng, leben = 0.6) {
    let neu = 0;
    for (let i = 0; i < n && this.p.length < this.max; i++) {
      this.p.push({ x, y, z, vx: (rng() - 0.5) * 3, vy: 1.5 + rng() * 2, vz: (rng() - 0.5) * 3, leben, farbe });
      neu++;
    }
    return neu;
  }
  schritt(dt) {
    for (const q of this.p) { q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vy -= 6 * dt; q.leben -= dt; }
    this.p = this.p.filter((q) => q.leben > 0);
  }
}

  z.mana -= HANDEL_KOSTEN; z.flutFrei = 0; z.freiBis = {}; ev(z, 'handel', 0, 0);
  return true;
}

// Control: Lernpfad (S-003). Rein: Zeit kommt als Taktzahl, keine Plattform.



const feldNr = (x, y) => y * GROESSE + x;
// Ebene 2x2-Fläche (Höhe 1 bis 6), die der Spieler verändert hat (mindestens ein Feld anders als am Start)
const ebeneFlaeche = (z, start) => {
  for (let y = 0; y < GROESSE - 1; y++) for (let x = 0; x < GROESSE - 1; x++) {
    const h = z.karte[feldNr(x, y)];
    if (h >= 1 && h <= 6 && z.karte[feldNr(x + 1, y)] === h && z.karte[feldNr(x, y + 1)] === h && z.karte[feldNr(x + 1, y + 1)] === h
      && [[0, 0], [1, 0], [0, 1], [1, 1]].some(([dx, dy]) => z.karte[feldNr(x + dx, y + dy)] !== start[feldNr(x + dx, y + dy)])) return { x, y };
  }
  return null;
};

class Lernpfad {
  constructor(z) {
    this.start = Uint8Array.from(z.karte); this.gehoben = new Set();
    this.nr = 0; this.fertig = false; this.zaehler = 0; this.hinweis = false; this.basis = 0;
  }
  get text() { return this.fertig ? '' : AUFGABEN[this.nr]; }
  get kopf() { return this.fertig ? '' : `Aufgabe ${this.nr + 1} von ${ANZAHL}`; }
  get hinweisText() { return this.hinweis && !this.fertig ? HINWEISE[this.nr] : ''; }
  erfuellt(z) {
    switch (this.nr) {
      case 0: return this.gehoben.size >= 3;
      case 1: return ebeneFlaeche(z, this.start) !== null;
      case 2: return anzahl(z, 0) >= 12;
      case 3: return z.ertrunken[1] > this.basis || anzahl(z, 1) === 0;
      default: return anzahl(z, 0) >= 20 && anzahl(z, 1) === 0;
    }
  }
  // Prüft nach Tipps und nach jedem Takt; höchstens eine Aufgabe je Aufruf. Liefert true bei Fortschritt.
  pruefe(z) {
    if (this.fertig) return false;
    z.karte.forEach((h, i) => { if (h > this.start[i]) this.gehoben.add(i); });
    if (!this.erfuellt(z)) return false;
    this.nr++; this.zaehler = 0; this.hinweis = false;
    if (this.nr >= ANZAHL) { this.fertig = true; z.lernFertig = true; }
    if (this.nr === 3) this.basis = z.ertrunken[1];
    return true;
  }
  // Einmal je Simulationstakt nach dem Takt aufrufen
  takt(z) {
    if (this.pruefe(z) || this.fertig) return;
    if (++this.zaehler >= HINWEIS_TAKTE) this.hinweis = true;
  }
  // Zielfeld der Markierung (oder null, wenn die Aufgabe keines hat)
  ziel(z) {
    if (this.fertig) return null;
    if (this.nr === 0) { for (const [x, y] of [[6, 10], [7, 10], [6, 11], [7, 11]]) if (z.karte[feldNr(x, y)] <= this.start[feldNr(x, y)]) return { x, y }; return { x: 6, y: 10 }; }
    if (this.nr === 1) return ebeneFlaeche(z, this.start) || { x: 6, y: 10 };
    if (this.nr === 2) return null;
    const g = z.anhaenger.find((a) => a.volk === 1);
    return g ? { x: g.x, y: g.y } : null;
  }
}

// Control: Ergebnis einer Kampagnenkarte buchen (S-006, S-011). Liest den gespeicherten Stand frisch, mischt (beste Sterne je Karte),
// rechnet den Sieg ein und schreibt zurück. Die Ablage wird hineingereicht (R-04).

function buche(fort, ablage, id, erg, deckel = 3) {
  const neu = nachSieg(mische(fort, lade(ablage.lies())), id, erg, deckel);
  ablage.schreibe(serialisiere(neu));

}

// Control: Einstieg für die UI. Reicht Plattformteile (THREE, Zeit) hinein und bindet Boundary an.

















const TAKT_MS = 500;

// Plattformteile kommen hinein (R-02): THREE, AudioContext-Klasse, Geräte-Pixelverhältnis; opt: seed, taktMs, look, glatt, lernen
function erzeuge(canvas, THREE, opt = {}, plattform = {}) {
  const { seed = 1, taktMs = TAKT_MS, look = 'a0', glatt = false, lernen = false } = opt;
  const { AudioKlasse = null, dpr = 1, speicherQuelle = null } = plattform;
  const ablage = new Speicher(speicherQuelle);
  let testFrei = false, fort = lade(ablage.lies()), kartenId = null, gebucht = false, sterneLetzte = 0, leicht = false, tag = null;   // tag: { j, m, t, seed, karte } der täglichen Aufgabe
  let z = lernen ? neuerLernZustand() : neuerZustand(), rng = mulberry32(seed), letzter = null;
  let lp = lernen ? new Lernpfad(z) : null, pausiert = false, hilfePause = false;
  const spiel = new Spiel(z); spiel.zufall = () => rng();
  const szene = new Szene(canvas, THREE, look, glatt, dpr);
  const ton = new Ton(AudioKlasse), partikel = new Partikel(), prng = mulberry32(seed + 7);
  let letztesT = null, jingleSchon = false;
  const FARBE = { heben: 0xd9c27a, haus: 0xffffff, geburt: 0x7dff9a, ertrinken: 0x6ac8ff, kampf: 0xff6a6a, flut: 0x4aa8ff, vulkan: 0xff7a2a, sturm: 0xc8d8ff, erdbeben: 0xb08a5a, handel: 0xffe36a };
  const ANZ = { heben: 6, haus: 10, geburt: 5, ertrinken: 6, kampf: 4, flut: 30, vulkan: 40, sturm: 24, erdbeben: 30, handel: 8 };
  return {
    spiel,
    groesse: (b, h) => szene.groesse(b, h),
    // jetzt: hineingereichte Zeit in ms; ruft pro 500 ms einen Takt auf, höchstens 4 je Aufruf
    vorwaerts(jetzt) {
      if (letzter === null || pausiert) { letzter = jetzt; if (pausiert) return false; }
      let n = 0, geaendert = false;
      while (jetzt - letzter >= taktMs && n < 4 && this.stand() === 'laeuft') { takt(z, rng); if (lp) lp.takt(z); letzter += taktMs; n++; geaendert = true; }
      if (n === 4) letzter = jetzt;

    },
    // Bucht das Ergebnis einer Kampagnenkarte genau einmal (Seiteneffekt nur beim ersten Aufruf nach dem Ende)
    stand() {
      const e = ende(z);
      if (e !== 'laeuft' && (kartenId || tag) && !gebucht) {
        gebucht = true; const erg = { sieg: e === 'sieg', takte: z.takt, ertrunken: z.ertrunken[0] };
        const k = kartenId ? karteZu(kartenId) : tag.karte, deckel = z.leicht ? leichtSterne(3) : 3;
        sterneLetzte = Math.min(sterneFuer(k, erg), deckel);
        if (kartenId) fort = buche(fort, ablage, kartenId, erg, deckel);
      }
      return e;
    },
    volk: () => [anzahl(z, 0), gegnerZahl(z)],
    // Hinweis für die Kopfzeile: Hochwasser (nur Karten mit wechselndem Wasserstand) und Phase des Endgegners
    hinweis() { const h = hochwasserIn(z); return [h === 0 ? 'Hochwasser!' : h !== null && h <= 10 ? `Hochwasser in ${Math.ceil(h / 2)} s` : '', z.endgegner && z.phase === 2 ? 'Phase 2!' : ''].filter(Boolean).join(' · '); },
    neustart() { z = lp ? neuerLernZustand() : (kartenId ? neuerKartenZustand(karteZu(kartenId), leicht) : tag ? neuerKartenZustand(tag.karte, leicht) : neuerZustand()); gebucht = false; lp = lp ? new Lernpfad(z) : null; rng = mulberry32(tag ? tag.seed : seed); letzter = null; spiel.z = z; spiel.zuruecksetzen(); jingleSchon = false; ton.neuStart(); },
    // Lernpfad beenden (Überspringen oder geschafft): Karte 1-1 der Kampagne; mehrfaches Aufrufen startet nur einmal
    zumSpiel() { if (!lp) return false; lp = null; return this.starteKarte('1-1'); },
    // Kampagne (S-006): Kartenliste mit Stand, Karte starten, Ergebnis, Fortschritt löschen
    karten: () => KARTEN.map((k) => ({ id: k.id, welt: k.welt, name: k.name, offen: istOffen(fort, k.id), sterne: fort.sterne[k.id] | 0, boss: k.boss })),
    kartenId: () => kartenId,
    testFrei: () => testFrei, setzeTestFrei(an) { testFrei = !!an; },   // Prüfhilfe, wird nie gespeichert
    // frei = true startet auch gesperrte Karten (nur für Prüfläufe über die Adresse, kein Schutz vor Schummeln)
    starteKarte(id, frei = false) {
      const k = karteZu(id);
      if (!k || (!frei && !istOffen(fort, id))) return false;
      lp = null; kartenId = id; tag = null; z = neuerKartenZustand(k, leicht); rng = mulberry32(seed); letzter = null; spiel.z = z; spiel.zuruecksetzen(); jingleSchon = false; gebucht = false; sterneLetzte = 0; ton.neuStart();
      return true;
    },
    // Tägliche Aufgabe (S-009): Datum kommt hinein, Karte und Zufall folgen aus dem Datum; zählt nicht für die Kampagne
    starteTag(j, m, t) {
      const sd = tagesSeed(j, m, t), k = tageskarte(sd);
      if (!k) return false;
      lp = null; kartenId = null; tag = { j, m, t, seed: sd, karte: k }; z = neuerKartenZustand(k, leicht); rng = mulberry32(sd); letzter = null; spiel.z = z; spiel.zuruecksetzen(); jingleSchon = false; gebucht = false; sterneLetzte = 0; ton.neuStart();
      return true;
    },
    setzeLeicht(an) { leicht = an === true; },
    leichtAn: () => leicht,
    // Nach dem Ende einer Kampagnenkarte: Sterne und nächste offene Karte
    ergebnis() { const n = kartenId ? KARTEN[KARTEN.findIndex((k) => k.id === kartenId) + 1] : null; return { sterne: sterneLetzte, weiter: n && istOffen(fort, n.id) ? n.id : null, dauerhaft: ablage.dauerhaft, tag: !!tag, leicht, teil: tag ? teilText(tag.j, tag.m, tag.t, tag.karte, sterneLetzte, z.leicht) : null }; },
    loescheFortschritt() { fort = neuerFortschritt(); ablage.loesche(); },
    lernpfad: () => lp,
    hilfekarten: () => HILFE,
    // nach einem Tipp: Fortschritt im Lernpfad prüfen
    nachTipp() { return lp ? lp.pruefe(z) : false; },
    pause(an) { hilfePause = !!an; pausiert = hilfePause || !ton.sichtbar; },
    marke(b, h) {
      const f = lp && lp.ziel(z); if (!f) return null;

      return { x: p.x, y: p.y, durchmesser: Math.max(28, Math.round(feldBreitePx(b, h, spiel.zoom, ausschnitt(look)) * 1.3)) };
    },
    zeichne(t) {
      const dt = letztesT === null ? 0 : Math.min(0.05, (t - letztesT) / 1000); letztesT = t;
      ton.neuesBild();
      for (const e of entleere(z)) {

        partikel.erzeuge(ANZ[e.art] || 4, e.x + 0.5 - GROESSE / 2, hh, e.y + 0.5 - GROESSE / 2, FARBE[e.art] || 0xffffff, prng);
      }

    },
    entsperre: () => ton.entsperre(),
    stumm: (an) => ton.setzeStumm(an),
    // Tab im Hintergrund: Spiel und Ton anhalten, beim Zurückkommen fortsetzen
    sichtbar(an) { ton.setzeSichtbar(an); pausiert = !an || hilfePause; },
    takte: () => z.takt,
    stufe: () => musikStufe(gegnerZahl(z), z.ziel),
    mana: () => [z.mana, MANA_MAX],
    flutBereit: () => flutBereit(z),
    // Götterkräfte der Karte (S-007): Name, Kosten, bereit, gewählt; dazu der Händler, wenn die Karte einen hat
    kraefte: () => [...z.kraefte.map((n) => ({ name: n, kosten: KRAEFTE[n].kosten, bereit: kraftBereit(z, n), gewaehlt: spiel.werkzeug === n })),
      ...(z.haendler ? [{ name: 'handel', kosten: HANDEL_KOSTEN, bereit: !z.lern && z.mana >= HANDEL_KOSTEN, gewaehlt: false }] : [])],
    handeln: () => handel(z),

    ring(px, py, b, h) {

    ansicht() { szene.ansicht(spiel.zoom, spiel.mitte.x, spiel.mitte.y); },

}

  beschrifteGrafik();

  // Zeiger: ein Finger = Ring (Tippen/Ziehen), zwei Finger = Zoom und Verschieben (malen nicht)

  const startNeu = () => { schluss.hidden = true; stand.schmutzig = true; zuletzt = ''; aktualisiere(); };

    for (const k of spiel.karten()) {
      if (k.welt !== welt) { welt = k.welt; const h = document.createElement('p'); h.className = 'welt'; h.append(welt === 5 ? 'Finale' : 'Welt ' + welt); liste.append(h); }
      const b = document.createElement('button'); b.disabled = !(k.offen || spiel.testFrei()); b.dataset.karte = k.id;
      b.append(k.id + ' ' + k.name, document.createElement('br'), k.offen ? sterneText(k.sterne) : spiel.testFrei() ? 'Test' : 'gesperrt');
      b.addEventListener('click', () => { if (spiel.starteKarte(k.id, spiel.testFrei())) { menueAuf(false); startNeu(); } });
      liste.append(b);
    }
    document.getElementById('speicherhinweis').replaceChildren(spiel.ergebnis().dauerhaft ? 'Fortschritt wird auf diesem Gerät gespeichert.' : 'Fortschritt gilt nur bis zum Neuladen der Seite.');
  };
  const menueAuf = (an) => { menue.hidden = !an; spiel.pause(an); if (an) { baueMenue(); beschrifteLeicht(); wegFrage = false; wegTaste.replaceChildren('Fortschritt löschen'); document.getElementById('kartenzu').focus(); } };
  const testTaste = document.getElementById('testfrei');   // Prüfhilfe: gesperrte Karten zum Ausprobieren öffnen (zählt nicht für Sterne; auf der Seite entfernt)
  if (testTaste) testTaste.addEventListener('click', () => { const an = !spiel.testFrei(); spiel.setzeTestFrei(an); testTaste.setAttribute('aria-pressed', String(an)); baueMenue(); });
  document.getElementById('kartentaste').addEventListener('click', () => menueAuf(true));
  document.getElementById('kartenzu').addEventListener('click', () => menueAuf(false));
  zuKartenTaste.addEventListener('click', () => { schluss.hidden = true; menueAuf(true); });
  weiterTaste.addEventListener('click', () => { if (spiel.starteKarte(spiel.ergebnis().weiter)) startNeu(); });
  let wegFrage = false;   // erstes Tippen fragt nach, zweites löscht
  wegTaste.addEventListener('click', () => { if (!wegFrage) { wegFrage = true; wegTaste.replaceChildren('Wirklich löschen?'); return; } wegFrage = false; spiel.loescheFortschritt(); baueMenue(); wegTaste.replaceChildren('Fortschritt löschen'); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menue.hidden) menueAuf(false); });
  // Tägliche Aufgabe, leichter Modus, Teilen (S-009)
  const leichtTaste = document.getElementById('leichttaste');
  const beschrifteLeicht = () => { const an = spiel.leichtAn(); leichtTaste.replaceChildren(an ? 'Leicht: an' : 'Leicht: aus'); leichtTaste.setAttribute('aria-pressed', String(an)); };
  leichtTaste.addEventListener('click', () => { spiel.setzeLeicht(!spiel.leichtAn()); beschrifteLeicht(); });
  document.getElementById('tagtaste').addEventListener('click', () => { if (spiel.starteTag(...heute())) { menueAuf(false); startNeu(); } });
  leichtVersuch.addEventListener('click', () => { spiel.setzeLeicht(true); beschrifteLeicht(); spiel.neustart(); startNeu(); });
  teilTaste.addEventListener('click', async () => {   // Teilen: Systemdialog, sonst Zwischenablage, sonst bleibt der Text zum Abschreiben sichtbar
    const t = spiel.ergebnis().teil; if (!t) return;
    try { if (navigator.share) await navigator.share({ text: t }); else await navigator.clipboard.writeText(t); } catch (e) { /* abgebrochen oder gesperrt: Text bleibt sichtbar */ }
  });
  // Lernpfad: Aufgabenzeile, Markierung, Hilfe, Überspringen
  const aufgabe = document.getElementById('aufgabe'), oben = document.getElementById('oben'), marke = document.getElementById('marke');
  const hilfe = document.getElementById('hilfe');
  document.getElementById('hilfekarten').replaceChildren(...spiel.hilfekarten().map((t) => { const p = document.createElement('p'); p.append(t); return p; }));
  const hilfeAuf = (an) => { hilfe.hidden = !an; spiel.pause(an); if (an) document.getElementById('hilfezu').focus(); };
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !hilfe.hidden) hilfeAuf(false); });
  document.addEventListener('visibilitychange', () => spiel.sichtbar(!document.hidden));
  document.getElementById('hilfetaste').addEventListener('click', () => hilfeAuf(true));
  document.getElementById('hilfezu').addEventListener('click', () => hilfeAuf(false));
  document.getElementById('skip').addEventListener('click', () => { if (spiel.zumSpiel()) { stand.schmutzig = true; schluss.hidden = true; } });
  let aufgabeZuletzt = '';
  const skipTaste = document.getElementById('skip');
  let nrZuletzt = 0;
  const zeigeLernpfad = (jetzt) => {
    const lp = spiel.lernpfad();
    oben.hidden = false; skipTaste.hidden = !lp; aufgabe.hidden = !lp || lp.fertig; marke.hidden = true;
    if (!lp) { nrZuletzt = 0; return; }
    if (lp.nr > nrZuletzt) { stand.haekchenBis = jetzt + 1000; stand.haekchen = `✓ Aufgabe ${lp.nr} geschafft!`; }
    nrZuletzt = lp.nr;
    if (stand.haekchenBis && jetzt < stand.haekchenBis) { aufgabe.hidden = false; aufgabeZuletzt = ''; aufgabe.replaceChildren(stand.haekchen); stand.schmutzig = true; return; }
    const t = lp.kopf + '|' + lp.text + '|' + lp.hinweisText;
    if (t !== aufgabeZuletzt) {
      aufgabeZuletzt = t; const k = document.createElement('small'); k.append(lp.hinweisText);
      aufgabe.replaceChildren(lp.kopf + ': ' + lp.text, ...(lp.hinweisText ? [k] : []));
    }
    const m = spiel.marke(innerWidth, innerHeight);
    if (m && hilfe.hidden) { marke.hidden = false; marke.style.width = marke.style.height = m.durchmesser + 'px'; marke.style.left = (m.x - m.durchmesser / 2) + 'px'; marke.style.top = (m.y - m.durchmesser / 2) + 'px'; }
  };
  // Götterkräfte der Karte (S-007): Tasten je Karte neu bauen, Zustand je Takt aktualisieren
  const kraefteLeiste = document.getElementById('kraefte');
  let kraftTasten = '';
  const aktualisiereKraefte = () => {
    const liste = spiel.kraefte(), namen = liste.map((k) => k.name).join();
    flutTaste.hidden = !liste.some((k) => k.name === 'flut');
    if (namen !== kraftTasten) {
      kraftTasten = namen; kraefteLeiste.replaceChildren();
      for (const k of liste.filter((q) => q.name !== 'flut')) {
        const b = document.createElement('button'); b.id = 'kraft-' + k.name; b.append(`${KRAFT_NAME[k.name]} ${k.kosten}`); b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => {
          spiel.entsperre();
          if (k.name === 'handel') { spiel.handeln(); stand.schmutzig = true; return; }
          spiel.spiel.waehle(k.name); aktualisiere();
        });
        kraefteLeiste.append(b);
      }
      kraefteLeiste.hidden = !kraefteLeiste.childElementCount;
    }
    const w = spiel.spiel.werkzeug;
    for (const n of Object.keys(tasten)) tasten[n].setAttribute('aria-pressed', String(w === n));
    flutTaste.setAttribute('aria-pressed', String(w === 'flut'));
    for (const k of liste) {
      if (k.name === 'flut') continue;
      const b = document.getElementById('kraft-' + k.name); if (!b) continue;
      b.disabled = !k.bereit; b.setAttribute('aria-pressed', String(k.gewaehlt));
    }
  };
  let zuletzt = '';
  const aktualisiere = () => {
    aktualisiereKraefte();
    const [a, b] = spiel.volk();
    const [m, mm] = spiel.mana();
    const info = spiel.hinweis();
    const t = `Volk ${a} · Gegner ${b} · Mana ${m}/${mm}${info ? ' · ' + info : ''}`;
    if (t !== zuletzt) { zuletzt = t; hud.replaceChildren(t); }
    flutTaste.disabled = !spiel.flutBereit(); if (flutTaste.disabled) flutTaste.setAttribute('aria-pressed', 'false');
    rand.hidden = spiel.stufe() === 0;
    const e = spiel.stand();
    if (e !== 'laeuft' && schluss.hidden) {
      const lern = !!spiel.lernpfad(), erg = spiel.ergebnis();
      text.replaceChildren(e === 'sieg' ? (lern ? 'Sieg! Lernpfad geschafft' : 'Sieg! ' + (spiel.kartenId() ? sterneText(erg.sterne) : '')) : 'Niederlage');
      weiterTaste.hidden = !(e === 'sieg' && erg.weiter); zuKartenTaste.hidden = lern;
      leichtVersuch.hidden = lern || e === 'sieg' || erg.leicht;
      teilTaste.hidden = !erg.teil; teilText.hidden = !erg.teil; if (erg.teil) teilText.replaceChildren(erg.teil);
      neustartTaste.replaceChildren(lern ? (e === 'sieg' ? 'Zur ersten Insel' : 'Nochmal') : 'Neustart');
      schluss.hidden = false; (weiterTaste.hidden ? neustartTaste : weiterTaste).focus();   // Fokus auf die erste sichtbare Taste (Tastatur und Bildschirmleser)
    }
  };
  const schleife = (jetzt) => {
    if (stand.haekchenBis && jetzt >= stand.haekchenBis) { stand.haekchenBis = 0; stand.schmutzig = true; }
    if (!stand.pause && spiel.vorwaerts(jetzt)) { stand.schmutzig = true; aktualisiere(); }
    if (look !== 'a0') stand.schmutzig = true; // bewegtes Wasser
    if (stand.schmutzig) {
      spiel.zeichne(jetzt); zeigeLernpfad(jetzt); stand.schmutzig = false;
      if (stand.grafikStart) { haken.__grafikdauer = performance.now() - stand.grafikStart; stand.grafikStart = 0; }
      if (stand.tippZeit) { haken.__reaktion = performance.now() - stand.tippZeit; stand.tippZeit = 0; }
    }
    stand.bilder++; if (!stand.start) stand.start = jetzt;
    haken.__bilder = stand.bilder; haken.__laufzeit = jetzt - stand.start;
    requestAnimationFrame(schleife);
  };
  aktualisiere();
  requestAnimationFrame(schleife);
  haken.__startzeit = performance.now() - t0;
  haken.__volk = () => spiel.volk();
  haken.__mana = () => spiel.mana(); haken.__ton = () => spiel.tonDa(); haken.__partikel = () => spiel.partikelAnzahl(); haken.__stufe = () => spiel.stufe();
  haken.__feldAn = (x, y) => spiel.feldAn(x, y, innerWidth, innerHeight);
  haken.__lern = () => { const lp = spiel.lernpfad(); return lp ? { nr: lp.nr, fertig: lp.fertig, kopf: lp.kopf, hinweis: lp.hinweis } : null; };
  haken.__takt = () => spiel.takte(); haken.__halt = (an) => spiel.pause(an);
  haken.__ansicht = () => ({ px: spiel.pxJeEinheit(), zoom: spiel.spiel.zoom, mx: spiel.spiel.mitte.x, my: spiel.spiel.mitte.y, pixel: spiel.pixelgroesse(), pinsel: spiel.spiel.pinsel });
  haken.__karte = () => Array.from(spiel.spiel.karte); haken.__zustand = () => spiel.spiel.z;   // Prüfhaken: lebender Zustand (Prüfläufe setzen damit Ziele); auf der Seite entfernt
  haken.__karten = () => spiel.karten(); haken.__kartenId = () => spiel.kartenId();
}

starte();
</script></body></html>
